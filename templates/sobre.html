<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bixuco • Sobre</title>

    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">
    <script src="/js/deeplink.js"></script>


    <!-- Ícones -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <script src="https://translate.google.com/translate_a/element.js?cb=iniciarTradutor" async></script>

    <!-- Variáveis compartilhadas de tema (claro/escuro) -->
    <link
        rel="stylesheet"
        href="/css/tema.css"
    >

    <link rel="stylesheet" href="/css/layout.css">

    <!-- Layout compartilhado (sidebar, topo, tema claro/escuro) — o mesmo do Home e do Perfil -->
    <link
        rel="stylesheet"
        href="/css/home.css"
    >

    <!-- CSS específico desta página -->
    <link
        rel="stylesheet"
        href="/css/sobre.css"
    >

</head>




<body>

<div class="container">

    <!-- ========================= -->
    <!-- MENU LATERAL -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div class="logo">

            <img
                src="/img/logo_nome.png"
                alt="Logo Bixuco"
            >

        </div>

        <nav>

            <a href="/home">

                <i class="fa-solid fa-house"></i>

                <span>Início</span>

            </a>

            <a href="/relatorios">

                <i class="fa-solid fa-chart-line"></i>

                <span>Relatórios</span>

            </a>

            <a href="/configuracoes">

                <i class="fa-solid fa-gear"></i>

                <span>Configurações</span>

            </a>

            <a
                href="/sobre"
                class="ativo"
            >

                <i class="fa-solid fa-circle-info"></i>

                <span>Sobre</span>

            </a>

        </nav>

        <button
            class="btn-relatorio"
            type="button"
        >

            Relatório diário

        </button>

        <div class="tema">

            <button
                id="btnClaro"
                class="ativo"
                type="button"
            >

                <i class="fa-regular fa-sun"></i>

                Claro

            </button>

            <button
                id="btnEscuro"
                type="button"
            >

                <i class="fa-regular fa-moon"></i>

                Escuro

            </button>

        </div>
        <div class="sidebar-divisor"></div>
        <a
            href="/logout"
            class="logout"
        >

            <i class="fa-solid fa-arrow-right-from-bracket"></i>

            <span>Sair</span>

        </a>

    </aside>

    <!-- ========================= -->
    <!-- CONTEÚDO -->
    <!-- ========================= -->

    <main class="conteudo">

        <header class="topo">
            

            <button class="tradutor" type="button" id="btnTraduzir">
                <i class="fa-solid fa-language"></i>
                <span id="textoTradutor">Traduzir para inglês</span>
            </button>

            <div
                id="google_translate_element"
                style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);"
            ></div>


            <div class="usuario">

                <div class="notificacoes-wrapper">
                    <button class="notificacoes" type="button" id="btnNotificacoes">
                        <i class="fa-regular fa-bell"></i>
                        <span id="quantidadeNotificacoes" class="badge">0</span>
                    </button>

                    <div class="painel-notificacoes" id="painelNotificacoes">
                        <div class="painel-header">Notificações</div>
                        <div id="listaNotificacoes">
                            <div class="painel-vazio">Carregando...</div>
                        </div>
                    </div>
                </div>

                <img
                    id="fotoUsuario"
                    src="/img/perfilPadrao.png"
                    alt="Foto do usuário"
                    title="Ver perfil"
                    style="cursor: pointer;"
                >

                <div>

                    <h3 id="nomeUsuario">

                        Carregando...

                    </h3>

                    <span id="tipoConta">

                        ...

                    </span>

                </div>

            </div>

        </header>

        <!-- ========================= -->
        <!-- TÍTULO -->
        <!-- ========================= -->

        <section class="cabecalho">

            <div>

                <h1>

                    Sobre o Bixuco

                </h1>

                <p>

                    Conheça nossa história, missão e como trabalhamos
                    para transformar vidas.

                </p>

            </div>

            <img
                src="/img/bixucomascote.png"
                alt="Bixuco"
            >

        </section>

        <!-- ========================= -->
        <!-- CARDS -->
        <!-- ========================= -->

        <section class="cards">

            <button
                class="card"
                type="button"
                data-topico="sobre"
            >

                <i class="fa-solid fa-circle-info"></i>

                <h3>Sobre nós</h3>

                <p>Nossa história e missão</p>

            </button>

            <button
                class="card"
                type="button"
                data-topico="ajudamos"
            >

                <i class="fa-regular fa-heart"></i>

                <h3>Como ajudamos</h3>

                <p>O que fazemos por você</p>

            </button>

            <button
                class="card"
                type="button"
                data-topico="funciona"
            >

                <i class="fa-solid fa-gear"></i>

                <h3>Como funciona</h3>

                <p>Pelúcia + aplicativo + relatórios</p>

            </button>

            <button
                class="card"
                type="button"
                data-topico="publico"
            >

                <i class="fa-solid fa-users"></i>

                <h3>Para quem é</h3>

                <p>Pais e terapeutas</p>

            </button>

            <button
                class="card"
                type="button"
                data-topico="naofazemos"
            >

                <i class="fa-solid fa-ban"></i>

                <h3>O que não fazemos</h3>

                <p>Sem diagnósticos</p>

            </button>

            <button
                class="card"
                type="button"
                data-topico="privacidade"
            >

                <i class="fa-solid fa-shield-halved"></i>

                <h3>Privacidade</h3>

                <p>Como protegemos seus dados</p>

            </button>

            <button
                class="card"
                type="button"
                data-topico="proposito"
            >

                <i class="fa-solid fa-trophy"></i>

                <h3>Nosso propósito</h3>

                <p>Missão, visão e valores</p>

            </button>

            <button
                class="card"
                type="button"
                data-topico="contato"
            >

                <i class="fa-solid fa-headset"></i>

                <h3>Contato e suporte</h3>

                <p>Fale com nossa equipe</p>

            </button>

        </section>

        <!-- ========================= -->
        <!-- FRASE FINAL -->
        <!-- ========================= -->

        <section class="frase-final">

            <img
                src="/img/BixucoDormindo.png"
                alt="Bixuco"
            >

            <p>
                Mais do que tecnologia, entregamos
                <strong>conexão</strong>,
                <strong>empatia</strong> e
                <strong>inteligência</strong>
                para apoiar o desenvolvimento infantil.
            </p>

        </section>

    </main>

</div>

<!-- ========================= -->
<!-- MODAL (fora do container) -->
<!-- ========================= -->

<div
    id="modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tituloModal"
>

    <div class="modal-conteudo">

        <!-- Botão fechar -->
        <button
            id="fecharModal"
            class="fechar"
            type="button"
            aria-label="Fechar"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>

        <!-- Ícone do card selecionado -->
        <div
            id="iconModal"
            class="modal-icone"
        ></div>

        <!-- Título -->
        <h2 id="tituloModal"></h2>

        <!-- Conteúdo -->
        <div
            id="textoModal"
            class="modal-texto"
        ></div>

    </div>

</div>

<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script src="/js/sobre.js"></script>

<script src="/js/tema.js"></script>

</body>

</html>
