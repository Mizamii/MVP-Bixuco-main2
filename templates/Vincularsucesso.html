<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bixuco vinculado</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6fa;
    padding: 24px;
  }

  #card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 20px;
  }

  #icon-wrap {
    width: 110px;
    height: 110px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: #dcfce7;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #icon-wrap i {
    font-size: 46px;
    color: #22c55e;
  }

  h1 {
    font-size: 24px;
    color: #1f2937;
    margin-bottom: 10px;
  }

  #subtitle {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  #btn-inicio {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div id="card">
    <div id="icon-wrap">
      <i class="fa-solid fa-check"></i>
    </div>

    <h1>Bixuco vinculado!</h1>
    <p id="subtitle">
      Tudo pronto. Agora vocês estão prontos para começar a jornada juntos.
    </p>

    <button id="btn-inicio" type="button">Ir para o início</button>
  </div>

<script>
  document.getElementById('btn-inicio').addEventListener('click', () => {
    window.location.href = '/home';
  });
</script>

</body>
</html>
