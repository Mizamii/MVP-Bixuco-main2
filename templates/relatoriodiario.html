<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bixuco — Relatório diário</title>

    <!-- Ícones -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="/css/relatoriodiario.css"
    >

</head>

<style>
    /* 🔧 Estilos da mensagem de status (sucesso/erro) — sem CSS externo pronto ainda */
    .mensagem-status {
        display: none;
        max-width: 480px;
        margin: 0 auto 1.25rem;
        padding: 0.9rem 1.1rem;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        text-align: center;
    }
    .mensagem-status.visivel {
        display: block;
    }
    .mensagem-status.sucesso {
        background: rgba(50, 194, 109, 0.12);
        color: #1E8E4F;
        border: 1px solid rgba(50, 194, 109, 0.3);
    }
    .mensagem-status.aviso {
        background: rgba(255, 170, 0, 0.12);
        color: #9A6700;
        border: 1px solid rgba(255, 170, 0, 0.3);
    }
    .mensagem-status.erro {
        background: rgba(255, 68, 68, 0.1);
        color: #C0392B;
        border: 1px solid rgba(255, 68, 68, 0.3);
    }

    /* ========================= */
    /* PAINEL DE NOTIFICAÇÕES */
    /* ========================= */

    .notificacoes-wrapper {
        position: relative;
    }

    .painel-notificacoes {
        display: none;
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        width: 320px;
        max-height: 380px;
        overflow-y: auto;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        z-index: 50;
    }
    .painel-notificacoes.aberto {
        display: block;
    }
    .painel-notificacoes .painel-header {
        padding: 1rem 1.1rem 0.75rem;
        font-weight: 700;
        font-size: 0.95rem;
        color: #141414;
        border-bottom: 1px solid #EFEFEF;
    }
    .painel-notificacoes .item-notificacao {
        padding: 0.85rem 1.1rem;
        border-bottom: 1px solid #F5F5F5;
        font-size: 0.85rem;
        color: #141414;
        line-height: 1.45;
    }
    .painel-notificacoes .item-notificacao:last-child {
        border-bottom: none;
    }
    .painel-notificacoes .item-notificacao .tempo-notificacao {
        display: block;
        margin-top: 0.25rem;
        font-size: 0.75rem;
        color: #999;
    }
    .painel-notificacoes .item-notificacao.nao-lida {
        background: rgba(10, 183, 251, 0.05);
    }
    .painel-notificacoes .painel-vazio {
        padding: 1.5rem 1.1rem;
        text-align: center;
        font-size: 0.85rem;
        color: #999;
    }
</style>

<body>

    <div class="container">

        <!-- ========================= -->
        <!-- MENU LATERAL -->
        <!-- ========================= -->

        <aside class="sidebar">

            <div class="logo">

                <img
                    src="/img/Logo_Colorida.png"
                    alt="Logo Bixuco"
                >

            </div>

            <nav>

                <a href="/home">

                    <i class="fa-solid fa-house"></i>

                    <span>Início</span>

                </a>

                <a href="/relatorios">

                    <i class="fa-solid fa-chart-line"></i>

                    <span>Relatórios</span>

                </a>

                <a href="/configuracoes">

                    <i class="fa-solid fa-gear"></i>

                    <span>Configurações</span>

                </a>

                <a href="/sobre">

                    <i class="fa-solid fa-circle-info"></i>

                    <span>Sobre</span>

                </a>

            </nav>

            <button
                class="btn-relatorio ativo"
                type="button"
            >

                Relatório diário

            </button>

            <div class="tema">

                <button
                    id="btnClaro"
                    class="ativo"
                    type="button"
                >

                    <i class="fa-regular fa-sun"></i>

                    Claro

                </button>

                <button
                    id="btnEscuro"
                    type="button"
                >

                    <i class="fa-regular fa-moon"></i>

                    Escuro

                </button>

            </div>

            <a
                href="/logout"
                class="logout"
            >

                <i class="fa-solid fa-arrow-right-from-bracket"></i>

                <span>Sair</span>

            </a>

        </aside>

        <!-- ========================= -->
        <!-- CONTEÚDO -->
        <!-- ========================= -->

        <main class="conteudo">

            <!-- Cabeçalho -->

            <header class="topo">

                <button
                    class="tradutor"
                    type="button"
                >

                    <i class="fa-solid fa-language"></i>

                    Traduzir para inglês

                </button>

                <div class="usuario">

                    <div class="notificacoes-wrapper">
                        <button class="notificacao" type="button" id="btnNotificacoes">
                            <i class="fa-regular fa-bell"></i>
                            <span id="quantidadeNotificacoes" class="badge">0</span>
                        </button>

                        <div class="painel-notificacoes" id="painelNotificacoes">
                            <div class="painel-header">Notificações</div>
                            <div id="listaNotificacoes">
                                <div class="painel-vazio">Carregando...</div>
                            </div>
                        </div>
                    </div>

                    <img
                        id="fotoUsuario"
                        src="/img/perfilPadrao.png"
                        alt="Perfil"
                        title="Ver perfil"
                        style="cursor: pointer;"
                        onclick="window.location.href='/perfil'"
                        onerror="this.src='/img/perfilPadrao.png'"
                    >

                    <div>

                        <h3 id="nomeUsuario">

                            Carregando...

                        </h3>

                        <span id="tipoConta">

                            ...

                        </span>

                    </div>

                </div>

            </header>

            <!-- Cabeçalho da página -->

            <section class="cabecalho-relatorio">

                <div>

                    <h1>

                        Relatório diário

                    </h1>

                    <p>

                        Ajude-nos a acompanhar o desenvolvimento
                        da sua criança de forma personalizada.

                    </p>

                </div>

                <img
                    src="/img/BixucoRelatorio.png"
                    alt="Mascote"
                >

            </section>

            <!-- 🔧 Mensagem de status (sucesso, aviso de duplicidade ou erro) -->

            <p
                id="mensagemStatus"
                class="mensagem-status"
            ></p>

            <!-- ========================= -->
            <!-- CARD DO RELATÓRIO -->
            <!-- ========================= -->

            <section
                id="cardRelatorio"
                class="card-relatorio"
            >

                <!-- Topo -->

                <div class="topo-card">

                    <span id="contadorPergunta">

                        Pergunta 1 de 10

                    </span>

                    <span
                        id="porcentagem"
                        class="porcentagem"
                    >

                        10% concluído

                    </span>

                </div>

                <!-- Barra -->

                <div
                    id="barraProgresso"
                    class="barra-progresso"
                >

                    <!-- Criada pelo JavaScript -->

                </div>

                <!-- Pergunta -->

                <h2 id="textoPergunta">

                    Carregando pergunta...

                </h2>

                <!-- Opções -->

                <div
                    id="listaRespostas"
                    class="lista-respostas"
                >

                    <!-- Criadas pelo JavaScript -->

                </div>

                <!-- Botão -->

                <button
                    id="btnProxima"
                    type="button"
                    disabled
                >

                    Próxima pergunta

                </button>

            </section>

        </main>

    </div>

    <script>

        // ==========================
        // DADOS DO RELATÓRIO
        // ==========================

        const perguntas = [

            {
                pergunta: "Ela demonstra desconforto com texturas de roupas ou alimentos?",
                respostas: [
                    "Sempre",
                    "Quase sempre",
                    "Raramente",
                    "Nunca"
                ]
            },

            {
                pergunta: "Hoje ela evitou contato visual?",
                respostas: [
                    "Sempre",
                    "Quase sempre",
                    "Raramente",
                    "Nunca"
                ]
            },

            {
                pergunta: "Como foi a comunicação hoje?",
                respostas: [
                    "Muito boa",
                    "Boa",
                    "Pouca",
                    "Nenhuma"
                ]
            },

            {
                pergunta: "Como estava o humor durante o dia?",
                respostas: [
                    "Muito calmo",
                    "Calmo",
                    "Agitado",
                    "Muito agitado"
                ]
            },

            {
                pergunta: "Apresentou crises sensoriais?",
                respostas: [
                    "Sim, várias",
                    "Algumas",
                    "Poucas",
                    "Nenhuma"
                ]
            },

            {
                pergunta: "Dormiu bem?",
                respostas: [
                    "Muito bem",
                    "Bem",
                    "Pouco",
                    "Muito pouco"
                ]
            },

            {
                pergunta: "Como foi a alimentação?",
                respostas: [
                    "Muito boa",
                    "Boa",
                    "Regular",
                    "Ruim"
                ]
            },

            {
                pergunta: "Realizou atividades propostas?",
                respostas: [
                    "Todas",
                    "Quase todas",
                    "Poucas",
                    "Nenhuma"
                ]
            },

            {
                pergunta: "Como foi a interação social?",
                respostas: [
                    "Excelente",
                    "Boa",
                    "Pouca",
                    "Nenhuma"
                ]
            },

            {
                pergunta: "Como você avaliaria o dia de hoje?",
                respostas: [
                    "Excelente",
                    "Bom",
                    "Regular",
                    "Difícil"
                ]
            }

        ];

        // ==========================
        // VARIÁVEIS
        // ==========================

        let perguntaAtual = 0;

        let respostaSelecionada = null;

        const respostasUsuario = [];

        const textoPergunta =
            document.getElementById("textoPergunta");

        const listaRespostas =
            document.getElementById("listaRespostas");

        const contador =
            document.getElementById("contadorPergunta");

        const porcentagem =
            document.getElementById("porcentagem");

        const barra =
            document.getElementById("barraProgresso");

        const btnProxima =
            document.getElementById("btnProxima");

        const cardRelatorio =
            document.getElementById("cardRelatorio");

        const mensagemStatus =
            document.getElementById("mensagemStatus");

        // ==========================
        // MENSAGEM DE STATUS
        // ==========================

        function mostrarMensagem(texto, tipo) {

            // tipo: "sucesso" | "aviso" | "erro"
            mensagemStatus.textContent = texto;
            mensagemStatus.className = `mensagem-status visivel ${tipo}`;

        }

        // ==========================
        // CRIAR BARRA
        // ==========================

        function atualizarBarra() {

            barra.innerHTML = "";

            perguntas.forEach((item, index) => {

                const bolinha = document.createElement("span");

                bolinha.classList.add("bolinha");

                if (index < perguntaAtual) {

                    bolinha.classList.add("respondida");

                } else if (index === perguntaAtual) {

                    bolinha.classList.add("ativa");

                }

                barra.appendChild(bolinha);

            });

        }

        // ==========================
        // CARREGAR PERGUNTA
        // ==========================

        function carregarPergunta() {

            respostaSelecionada = null;

            btnProxima.disabled = true;

            const atual = perguntas[perguntaAtual];

            textoPergunta.textContent = atual.pergunta;

            contador.textContent =
                `Pergunta ${perguntaAtual + 1} de ${perguntas.length}`;

            porcentagem.textContent =
                `${Math.round((perguntaAtual / perguntas.length) * 100)}% concluído`;

            atualizarBarra();

            listaRespostas.innerHTML = "";

            atual.respostas.forEach(opcao => {

                const botao = document.createElement("button");

                botao.type = "button";

                botao.className = "opcao";

                botao.textContent = opcao;

                botao.onclick = () => {

                    document
                        .querySelectorAll(".opcao")
                        .forEach(btn => {
                            btn.classList.remove("selecionada");
                        });

                    botao.classList.add("selecionada");

                    respostaSelecionada = opcao;

                    btnProxima.disabled = false;

                };

                listaRespostas.appendChild(botao);

            });

        }

        // ==========================
        // BOTÃO PRÓXIMA
        // ==========================

        btnProxima.addEventListener("click", () => {

            if (respostaSelecionada === null) {
                return;
            }

            respostasUsuario.push({
                pergunta: perguntas[perguntaAtual].pergunta,
                resposta: respostaSelecionada
            });

            perguntaAtual++;

            if (perguntaAtual >= perguntas.length) {

                finalizarRelatorio();
                return;

            }

            carregarPergunta();

        });

        // ==========================
        // FINALIZAR
        // ==========================

        async function finalizarRelatorio() {

            // Desabilita o botão para evitar duplo envio enquanto salva
            btnProxima.disabled = true;
            btnProxima.textContent = "Salvando...";

            try {

                const resposta = await fetch("/api/relatorio", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        respostas: respostasUsuario,
                        data: new Date().toISOString()
                    })

                });

                if (resposta.status === 401) {
                    window.location.href = "/logar";
                    return;
                }

                // 🔧 FIX: Trata o caso de relatório duplicado no mesmo dia
                // O backend retorna 409 quando o usuário já preencheu hoje
                if (resposta.status === 409) {

                    const dados = await resposta.json();

                    mostrarMensagem(
                        dados.erro || "Você já preencheu o relatório de hoje. Volte amanhã!",
                        "aviso"
                    );

                    // Esconde o card do questionário, já que não há mais o que fazer aqui hoje
                    cardRelatorio.style.display = "none";

                    return;

                }

                if (!resposta.ok) {
                    throw new Error("Resposta do servidor com erro");
                }

                // 🔧 FIX: Mostra a mensagem de parabéns antes de voltar para a home
                // O backend já criou a notificação — aqui é só o feedback imediato na tela
                mostrarMensagem(
                    "Você acabou de finalizar um relatório. Parabéns! 🎉",
                    "sucesso"
                );

                cardRelatorio.style.display = "none";

                setTimeout(() => {
                    window.location.href = "/home";
                }, 1800);

            } catch (erro) {

                console.log("Erro ao salvar relatório:", erro);

                // Reabilita o botão para o usuário tentar de novo
                btnProxima.disabled = false;
                btnProxima.textContent = "Próxima pergunta";

                mostrarMensagem(
                    "Erro ao salvar o relatório. Tente novamente.",
                    "erro"
                );

            }

        }

        // ==========================
        // PAINEL DE NOTIFICAÇÕES (SININHO)
        // ==========================

        const painelNotificacoes = document.getElementById("painelNotificacoes");
        const listaNotificacoes  = document.getElementById("listaNotificacoes");

        function formatarItemNotificacao(item) {
            const classeExtra = item.lida ? "" : "nao-lida";
            return `
                <div class="item-notificacao ${classeExtra}">
                    ${item.mensagem}
                    <span class="tempo-notificacao">${item.tempo}</span>
                </div>
            `;
        }

        async function carregarNotificacoes() {

            try {

                const resposta = await fetch("/api/notificacoes");

                if (!resposta.ok) throw new Error("Falha ao carregar notificações");

                const dados = await resposta.json();
                const itens = dados.notificacoes || [];

                if (itens.length === 0) {
                    listaNotificacoes.innerHTML = `<div class="painel-vazio">Nenhuma notificação por enquanto.</div>`;
                } else {
                    listaNotificacoes.innerHTML = itens.map(formatarItemNotificacao).join("");
                }

            } catch (erro) {
                console.log("Erro ao carregar notificações:", erro);
                listaNotificacoes.innerHTML = `<div class="painel-vazio">Não foi possível carregar as notificações.</div>`;
            }

        }

        async function marcarNotificacoesComoLidas() {

            try {
                await fetch("/api/notificacoes/marcar-lidas", { method: "POST" });
                document.getElementById("quantidadeNotificacoes").textContent = "0";
            } catch (erro) {
                console.log("Erro ao marcar notificações como lidas:", erro);
            }

        }

        document.getElementById("btnNotificacoes").addEventListener("click", async (e) => {

            e.stopPropagation();

            const estaAberto = painelNotificacoes.classList.contains("aberto");

            if (estaAberto) {
                painelNotificacoes.classList.remove("aberto");
                return;
            }

            painelNotificacoes.classList.add("aberto");

            await carregarNotificacoes();
            marcarNotificacoesComoLidas();

        });

        document.addEventListener("click", (e) => {
            if (!painelNotificacoes.contains(e.target)) {
                painelNotificacoes.classList.remove("aberto");
            }
        });

        // ==========================
        // DADOS DO USUÁRIO
        // ==========================

        async function carregarUsuario() {

            try {

                const resposta = await fetch("/api/home");

                if (resposta.status === 401) {
                    window.location.href = "/logar";
                    return;
                }

                if (!resposta.ok) {
                    return;
                }

                const usuario = await resposta.json();

                document.getElementById("nomeUsuario").textContent =
                    usuario.nome || "Usuário";

                document.getElementById("tipoConta").textContent =
                    usuario.tipoConta || "Responsável";

                if (usuario.fotoPerfil) {
                    document.getElementById("fotoUsuario").src = usuario.fotoPerfil;
                }

            } catch (erro) {

                console.log("Erro ao carregar usuário:", erro);

            }

        }

        // ==========================
        // TEMA
        // ==========================

        function aplicarTema(tema) {

            document.body.classList.remove("tema-claro", "tema-escuro");
            document.body.classList.add(`tema-${tema}`);

            document.getElementById("btnClaro").classList.toggle("ativo", tema === "claro");
            document.getElementById("btnEscuro").classList.toggle("ativo", tema === "escuro");

            localStorage.setItem("tema", tema);

        }

        document.getElementById("btnClaro").addEventListener("click", () => {
            aplicarTema("claro");
        });

        document.getElementById("btnEscuro").addEventListener("click", () => {
            aplicarTema("escuro");
        });

        // ==========================
        // INICIAR
        // ==========================

        // Aplica o tema salvo ao carregar a página
        const temaSalvo = localStorage.getItem("tema") || "claro";
        aplicarTema(temaSalvo);

        carregarUsuario();
        carregarPergunta();

    </script>

    <script src="/js/tema.js"></script>

</body>
