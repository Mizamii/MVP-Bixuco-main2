<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bixuco entregue!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body { background: #f4f6fa; min-height: 100vh; display: flex; }

  #sidebar {
    width: 240px;
    background: #ffffff;
    border-right: 1px solid #eef0f3;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  #logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 800;
    color: #16a34a;
    margin-bottom: 32px;
  }

  #logo i {
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 24px;
  }

  nav ul { list-style: none; }

  nav li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 10px;
    color: #6b7280;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    cursor: pointer;
  }

  nav li.ativo { background: #ecfdf3; color: #16a34a; }
  nav li i { width: 18px; text-align: center; }

  #theme-toggle {
    margin-top: auto;
    display: flex;
    background: #f1f3f5;
    border-radius: 20px;
    padding: 4px;
  }

  #theme-toggle button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 600;
    color: #6b7280;
    border-radius: 16px;
    cursor: pointer;
  }

  #theme-toggle button.ativo { background: #ffffff; color: #1f2937; }

  #sair {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 4px 4px;
    margin-top: 16px;
    border-top: 1px solid #eef0f3;
    color: #6b7280;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  #main { flex: 1; display: flex; flex-direction: column; }

  #topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
    padding: 16px 32px;
    background: #ffffff;
    border-bottom: 1px solid #eef0f3;
  }

  #btn-traduzir {
    border: 1px solid #bbf7d0;
    color: #16a34a;
    background: #ecfdf3;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  #usuario { display: flex; align-items: center; gap: 10px; }

  #avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
  }

  #usuario-info { line-height: 1.2; font-size: 13px; }
  #usuario-info strong { display: block; color: #1f2937; }
  #usuario-info span { color: #9ca3af; }

  #conteudo { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }

  #painel {
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  }

  #moldura {
    width: 100%;
    aspect-ratio: 4/3;
    background: #f1f3f5;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  #moldura i {
    font-size: 64px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 { font-size: 22px; color: #1f2937; margin-bottom: 10px; }
  #subtitulo { font-size: 14px; color: #6b7280; line-height: 1.5; margin-bottom: 24px; }

  #dica {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #ecfdf3;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #166534;
    text-align: left;
    margin-bottom: 22px;
  }

  #btn-vincular {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div id="sidebar">
    <div id="logo"><i class="fa-solid fa-cat"></i> BIXUCO</div>
    <nav>
      <ul>
        <li class="ativo"><i class="fa-solid fa-house"></i> Início</li>
        <li><i class="fa-solid fa-chart-line"></i> Relatórios</li>
        <li><i class="fa-solid fa-gear"></i> Configurações</li>
        <li><i class="fa-solid fa-circle-info"></i> Sobre</li>
      </ul>
    </nav>
    <div id="theme-toggle">
      <button class="ativo" type="button"><i class="fa-solid fa-sun"></i> Claro</button>
      <button type="button"><i class="fa-solid fa-moon"></i> Escuro</button>
    </div>
    <div id="sair"><i class="fa-solid fa-right-from-bracket"></i> Sair</div>
  </div>

  <div id="main">
    <div id="topbar">
      <button id="btn-traduzir" type="button"><i class="fa-solid fa-globe"></i> Traduzir para o inglês</button>
      <i class="fa-regular fa-bell" style="color:#6b7280;"></i>
      <div id="usuario">
        <div id="avatar"><i class="fa-solid fa-user"></i></div>
        <div id="usuario-info">
          <strong id="nome-usuario">Lucas</strong>
          <span>Responsável</span>
        </div>
      </div>
    </div>

    <div id="conteudo">
      <div id="painel">
        <div id="moldura"><i class="fa-solid fa-cat"></i></div>

        <h1>Bixuco entregue!</h1>
        <p id="subtitulo">Seu Bixuco chegou! Esperamos que vocês tenham momentos incríveis juntos.</p>

        <div id="dica">
          <i class="fa-solid fa-circle-check" style="color:#16a34a;"></i>
          Agora é hora de vincular o Bixuco à conta da criança para começar a jornada!
        </div>

        <button id="btn-vincular" type="button">Vincular meu Bixuco</button>
      </div>
    </div>
  </div>

<script>
  document.getElementById('btn-vincular').addEventListener('click', () => {
    window.location.href = '/VincularIdentidade';
  });
</script>

</body>
</html>
