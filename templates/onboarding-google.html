<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bixuco — Bem-vindo!</title>

    <!-- Biblioteca de ícones -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS da página -->
    <link
        rel="stylesheet"
        href="/css/criarcontas.css"
    >
    <link rel="stylesheet" href="/css/tema.css">
    <link rel="stylesheet" href="/css/publico.css">
    <script src="/js/deeplink.js"></script>

    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">
</head>

<body class="pagina-criar-conta pagina-publica pagina-auth">
    <main class="pagina-login">

        <!-- ========================= -->
        <!-- LADO ESQUERDO -->
        <!-- ========================= -->
        <section class="login-esquerda">

            <div class="login-esquerda__geometria"></div>
            <div class="login-esquerda__overlay"></div>

            <div class="login-esquerda__conteudo">
                <img
                    src="/img/Logo_Branca.png"
                    alt="Logo Bixuco"
                    class="login-esquerda__logo"
                >

                <h1 class="login-esquerda__titulo">
                    <span data-pt="Bem-vindo(a)" data-en="Welcome"></span>
                    <br>
                    <span data-pt="ao Bixuco!" data-en="to Bixuco!"></span>
                </h1>

                <p class="login-esquerda__slogan" data-pt="Pais e terapeutas juntos pelo bem-estar da criança." data-en="Parents and therapists together for the child's well-being.">
                    Pais e terapeutas juntos pelo bem-estar da criança.
                </p>
            </div>

            <!-- Ilustração -->
            <div class="login-esquerda__ilustracao-wrapper">
                <img
                    src="/img/familia-bixuco.png"
                    alt="Família utilizando o Bixuco"
                    class="login-esquerda__foto"
                >
            </div>

        </section>

        <!-- ========================= -->
        <!-- LADO DIREITO -->
        <!-- ========================= -->
        <section class="login-direita">

            <div class="controles-publicos controles-publicos--auth" aria-label="Preferências da página">
                <button type="button" class="controle-publico controle-publico--icone" id="btnTemaMobile" aria-label="Alternar tema" title="Alternar tema">
                    <i class="fa-regular fa-sun"></i>
                </button>
                <button type="button" class="tradutor tradutor--login" id="btnTraduzir">
                    <i class="fa-solid fa-language"></i>
                    <span id="textoTradutor">EN</span>
                </button>
            </div>

            <!-- Cabeçalho fixo no topo, com linha -->
            <div class="criarconta-header">
                <img
                    src="/img/logo-bixuco-colorida.png"
                    alt="Logo Bixuco"
                    class="criarconta-header__logo"
                >

                <h2 class="criarconta-titulo">
                    <span data-pt="Uma última coisa!" data-en="One last thing!">Uma última coisa!</span>
                </h2>
            </div>

            <!-- Corpo centralizado no restante do espaço -->
            <div class="criarconta-corpo">

                <p class="criarconta-ajuda">
                    <span data-pt="Como você vai utilizar o Bixuco? Isso nos ajuda a personalizar sua experiência." data-en="How will you use Bixuco? This helps us personalize your experience.">Como você vai utilizar o Bixuco? Isso nos ajuda a personalizar sua experiência.</span>
                </p>

                <!-- Cards de seleção — mesmo padrão do CriarContaS.html -->
                <div class="tipo-container">

                    <!-- Card responsável -->
                    <button
                        id="cardResponsavel"
                        class="tipo-card"
                        type="button"
                        aria-pressed="false"
                    >
                        <div class="tipo-card__conteudo">
                            <h4 class="tipo-card__titulo">
                                <span data-pt="Sou responsável" data-en="I'm a parent/guardian">Sou responsável</span>
                            </h4>

                            <p class="tipo-card__descricao">
                                <span data-pt="Acompanho o desenvolvimento do meu filho(a)." data-en="I track my child's development.">Acompanho o desenvolvimento do meu filho(a).</span>
                            </p>
                        </div>
                    </button>

                    <!-- Card terapeuta -->
                    <button
                        id="cardPsicologo"
                        class="tipo-card"
                        type="button"
                        aria-pressed="false"
                    >
                        <div class="tipo-card__conteudo">
                            <h4 class="tipo-card__titulo">
                                <span data-pt="Sou terapeuta" data-en="I'm a therapist">Sou terapeuta</span>
                            </h4>

                            <p class="tipo-card__descricao">
                                <span data-pt="Acompanho pacientes profissionalmente." data-en="I professionally track patients.">Acompanho pacientes profissionalmente.</span>
                            </p>

                            <div class="tag-crp">
                                <span data-pt="Requer validação de CRP" data-en="Requires CRP validation">Requer validação de CRP</span>
                            </div>
                        </div>
                    </button>

                </div>

                <div id="campoCrpGoogle" class="campo-crp-google" style="display: none;">

                    <label for="inputCrpGoogle">
                        <span data-pt="Informe seu CRP" data-en="Enter your CRP">Informe seu CRP</span>
                    </label>

                    <input
                        type="text"
                        id="inputCrpGoogle"
                        placeholder="CRP-06/123456"
                        maxlength="13"
                        autocomplete="off"
                    >

                    <small>
                        <span data-pt="Formato: CRP-00/000000" data-en="Format: CRP-00/000000">Formato: CRP-00/000000</span>
                    </small>

                </div>

                <!-- Erro inline em vez de alert() -->
                <span
                    id="erro-selecao"
                    class="erro-selecao"
                    style="display: none;"
                >
                    <span data-pt="Selecione como deseja utilizar o Bixuco." data-en="Select how you want to use Bixuco.">Selecione como deseja utilizar o Bixuco.</span>
                </span>

                <!-- Botão começa desabilitado — igual ao CriarContaS -->
                <button
                    type="button"
                    id="btnContinuar"
                    class="btn-continuar"
                    disabled
                >
                    <span data-pt="Continuar" data-en="Continue">Continuar</span>
                </button>

            </div>

        </section>

    </main>

    <script src="/js/publico-extra.js"></script>
    <script src="/js/tema.js"></script>
    <script src="/js/onboarding-google.js"></script>

</body>
</html>
