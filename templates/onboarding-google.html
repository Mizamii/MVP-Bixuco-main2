<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bixuco — Bem-vindo!</title>

    <!-- Biblioteca de ícones -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS da página -->
    <link
        rel="stylesheet"
        href="/css/criarcontas.css"
    >
    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">
</head>

<body class="pagina-criar-conta">
    <main class="pagina-login">

        <!-- ========================= -->
        <!-- LADO ESQUERDO -->
        <!-- ========================= -->
        <section class="login-esquerda">

            <div class="login-esquerda__geometria"></div>
            <div class="login-esquerda__overlay"></div>

            <div class="login-esquerda__conteudo">
                <img
                    src="/img/Logo_Branca.png"
                    alt="Logo Bixuco"
                    class="login-esquerda__logo"
                >

                <h1 class="login-esquerda__titulo">
                    Bem-vindo(a)
                    <br>
                    ao <span>Bixuco!</span>
                </h1>

                <p class="login-esquerda__slogan">
                    Pais e terapeutas juntos pelo bem-estar da criança.
                </p>
            </div>

            <!-- Ilustração -->
            <div class="login-esquerda__ilustracao-wrapper">
                <img
                    src="/img/familia-bixuco.png"
                    alt="Família utilizando o Bixuco"
                    class="login-esquerda__foto"
                >
            </div>

        </section>

        <!-- ========================= -->
        <!-- LADO DIREITO -->
        <!-- ========================= -->
        <section class="login-direita">

            <!-- Cabeçalho fixo no topo, com linha -->
            <div class="criarconta-header">
                <img
                    src="/img/logo-bixuco-colorida.png"
                    alt="Logo Bixuco"
                    class="criarconta-header__logo"
                >

                <h2 class="criarconta-titulo">
                    Uma última coisa!
                </h2>
            </div>

            <!-- Corpo centralizado no restante do espaço -->
            <div class="criarconta-corpo">

                <p class="criarconta-ajuda">
                    Como você vai utilizar o Bixuco?
                    Isso nos ajuda a personalizar sua experiência.
                </p>

                <!-- Cards de seleção — mesmo padrão do CriarContaS.html -->
                <div class="tipo-container">

                    <!-- Card responsável -->
                    <button
                        id="cardResponsavel"
                        class="tipo-card"
                        type="button"
                        onclick="selecionarTipo('pai')"
                        aria-pressed="false"
                    >
                        <div class="tipo-card__conteudo">
                            <h4 class="tipo-card__titulo">
                                Sou responsável
                            </h4>

                            <p class="tipo-card__descricao">
                                Acompanho o desenvolvimento do meu filho(a).
                            </p>
                        </div>
                    </button>

                    <!-- Card terapeuta -->
                    <button
                        id="cardPsicologo"
                        class="tipo-card"
                        type="button"
                        onclick="selecionarTipo('psicologo')"
                        aria-pressed="false"
                    >
                        <div class="tipo-card__conteudo">
                            <h4 class="tipo-card__titulo">
                                Sou terapeuta
                            </h4>

                            <p class="tipo-card__descricao">
                                Acompanho pacientes profissionalmente.
                            </p>

                            <div class="tag-crp">
                                Requer validação de CRP
                            </div>
                        </div>
                    </button>

                </div>

                <!-- Erro inline em vez de alert() -->
                <span
                    id="erro-selecao"
                    class="erro-selecao"
                    style="display: none;"
                >
                    Selecione como deseja utilizar o Bixuco.
                </span>

                <!-- Botão começa desabilitado — igual ao CriarContaS -->
                <button
                    type="button"
                    id="btnContinuar"
                    class="btn-continuar"
                    disabled
                >
                    Continuar
                </button>

            </div>

        </section>

    </main>

    <script>

        let tipoSelecionado = null;

        // ==========================
        // SELECIONAR TIPO
        // ==========================

        function selecionarTipo(tipo) {

            tipoSelecionado = tipo;

            document.querySelectorAll(".tipo-card").forEach(card => {
                card.classList.remove("tipo-card--ativo");
                card.setAttribute("aria-pressed", "false");
            });

            const cardSelecionado = tipo === "pai"
                ? document.getElementById("cardResponsavel")
                : document.getElementById("cardPsicologo");

            cardSelecionado.classList.add("tipo-card--ativo");
            cardSelecionado.setAttribute("aria-pressed", "true");

            document.getElementById("btnContinuar").disabled = false;
            document.getElementById("erro-selecao").style.display = "none";

        }

        // ==========================
        // CONTINUAR
        // ==========================

        document.getElementById("btnContinuar").addEventListener("click", async () => {

            if (!tipoSelecionado) {
                document.getElementById("erro-selecao").style.display = "block";
                return;
            }

            const btn = document.getElementById("btnContinuar");
            btn.disabled    = true;
            btn.textContent = "Salvando...";

            try {

                const resposta = await fetch("/api/onboarding-google", {
                    method:  "POST",
                    headers: { "Content-Type": "application/json" },
                    body:    JSON.stringify({ tipo: tipoSelecionado })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.erro || "Erro ao salvar.");
                }

                // Redireciona para o destino retornado pelo backend
                // pai → /AdicionarC | psicologo → /homeTerapeuta
                window.location.href = dados.destino;

            } catch (erro) {

                console.log("Erro no onboarding:", erro);

                const erroEl = document.getElementById("erro-selecao");
                erroEl.textContent   = erro.message || "Erro ao continuar. Tente novamente.";
                erroEl.style.display = "block";

                btn.disabled    = false;
                btn.textContent = "Continuar";

            }

        });

    </script>

    <script src="/js/tema.js"></script>

</body>
</html>
