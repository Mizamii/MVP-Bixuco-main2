<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar código — Bixuco</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body {
    background: #F5F7FA;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    background: #FFFFFF;
    max-width: 400px;
    width: 100%;
    padding: 32px 24px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    text-align: center;
  }
  h1 {
    color: #141414;
    font-size: 22px;
    margin-bottom: 8px;
  }
  p.sub {
    color: #5A5A5A;
    font-size: 14px;
    margin-bottom: 24px;
  }
  input#codigo {
    width: 100%;
    font-size: 28px;
    letter-spacing: 10px;
    text-align: center;
    padding: 12px;
    border: 2px solid #E0E0E0;
    border-radius: 8px;
    margin-bottom: 16px;
    outline: none;
  }
  input#codigo:focus {
    border-color: #32C26D;
  }
  button#confirmar {
    width: 100%;
    background: #32C26D;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: bold;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 12px;
  }
  button#confirmar:disabled {
    background: #A8DFC0;
    cursor: not-allowed;
  }
  button#reenviar {
    background: none;
    border: none;
    color: #32C26D;
    font-size: 14px;
    cursor: pointer;
    text-decoration: underline;
  }
  button#reenviar:disabled {
    color: #A8A8A8;
    cursor: not-allowed;
    text-decoration: none;
  }
  #mensagem {
    margin-top: 12px;
    font-size: 14px;
    min-height: 18px;
  }
  #mensagem.erro { color: #D64545; }
  #mensagem.sucesso { color: #32C26D; }
</style>
</head>
<body>

  <div class="card">
    <h1>Verificação de código</h1>
    <p class="sub">Enviamos um código de 6 dígitos para o seu e-mail. Ele expira em 10 minutos.</p>

    <input type="text" id="codigo" inputmode="numeric" maxlength="6" placeholder="000000" autofocus>

    <button id="confirmar">Confirmar</button>
    <button id="reenviar">Reenviar código</button>

    <div id="mensagem"></div>
  </div>

  <script src="/verificarCodigo.js"></script>


</body>
</html>
