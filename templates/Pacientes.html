<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bixuco — Meus Pacientes</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- favicon -->
    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">

    <!-- CSS externo — o amigo vai ligar aqui -->
    <link rel="stylesheet" href="/css/tema.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/pacientes.css">
    <script src="/js/deeplink.js"></script>


</head>
<body>

<div class="container">

    <!-- ========================= -->
    <!-- MENU LATERAL -->
    <!-- ========================= -->
    <aside class="sidebar">

        <div class="logo">
            <img src="/img/logo_nome.png" alt="Logo Bixuco">
        </div>

        <nav>
            <a href="/homeTerapeuta">
                <i class="fa-solid fa-house"></i>
                <span data-pt="Início" data-en="Home">Início</span>
            </a>

            <a href="/relatoriosTerapeutaS">
                <i class="fa-solid fa-chart-line"></i>
                <span data-pt="Relatórios" data-en="Reports">Relatórios</span>
            </a>

            <a href="/configuracoesT">
                <i class="fa-solid fa-gear"></i>
                <span data-pt="Configurações" data-en="Settings">Configurações</span>
            </a>

            <a href="/sobreT">
                <i class="fa-solid fa-circle-info"></i>
                <span data-pt="Sobre" data-en="About">Sobre</span>
            </a>

            <a href="/pacientes" class="ativo">
                <i class="fa-solid fa-user-plus"></i>
                <span data-pt="Pacientes" data-en="Patients">Pacientes</span>
            </a>
        </nav>

        <div class="tema">
            <button id="btnClaro" class="ativo" type="button">
                <i class="fa-regular fa-sun"></i>
                <span data-pt="Claro" data-en="Light">Claro</span>
            </button>
            <button id="btnEscuro" type="button">
                <i class="fa-regular fa-moon"></i>
                <span data-pt="Escuro" data-en="Dark">Escuro</span>
            </button>
        </div>

        <!-- divisor em degradê do amigo -->
        <div class="sidebar-divisor"></div>

        <a href="/logout" class="logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span data-pt="Sair" data-en="Log out">Sair</span>
        </a>

    </aside>

    <!-- ========================= -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ========================= -->
    <main class="conteudo">

        <!-- TOPO -->
        <header class="topo">

            <button class="tradutor" type="button" id="btnTraduzir">
                <i class="fa-solid fa-language"></i>
                <span id="textoTradutor">Traduzir para inglês</span>
            </button>

            <div class="usuario">

                <!-- sininho com painel de notificações -->
                <div class="notificacoes-wrapper">
                    <button class="notificacoes" type="button" id="btnNotificacoes">
                        <i class="fa-regular fa-bell"></i>
                        <span id="badgeNotificacoes" class="badge" style="display:none">0</span>
                    </button>

                    <div class="painel-notificacoes" id="painelNotificacoes">
                        <div class="painel-header" data-pt="Notificações" data-en="Notifications">Notificações</div>
                        <div id="listaNotificacoes">
                            <div class="painel-vazio" data-pt="Carregando..." data-en="Loading...">Carregando...</div>
                        </div>
                    </div>
                </div>

                <!-- foto clicável vai para o perfil do terapeuta -->
                <img
                    id="fotoUsuario"
                    src="/img/perfilPadrao.png"
                    alt="Foto do terapeuta"
                    title="Clique para ver seu perfil"
                    style="cursor:pointer;"
                >

                <div>
                    <h3 id="nomeTerapeuta" style="cursor:pointer">Carregando...</h3>
                    <span id="tipoConta" data-pt="Terapeuta" data-en="Therapist">Terapeuta</span>

                    <button type="button" class="btn-codigo-copiar" id="btnCodigoCopiar" title="Copiar código para compartilhar">
                        <span><span data-pt="Código" data-en="Code">Código</span>: <strong id="codigoTerapeuta">...</strong></span>
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>

            </div>

        </header>

        <!-- conteudo-corpo do amigo — permite scroll interno correto -->
        <div class="conteudo-corpo">

            <!-- TÍTULO DA PÁGINA -->
            <h1 class="titulo-pagina" data-pt="Meus pacientes" data-en="My patients">Meus pacientes</h1>

            <!-- BARRA DE BUSCA -->
            <div class="busca">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                    type="text"
                    id="inputBusca"
                    data-pt-placeholder="Buscar pacientes..."
                    data-en-placeholder="Search patients..."
                    placeholder="Buscar pacientes..."
                >
            </div>

            <!-- ABAS DE FILTRO -->
            <div class="abas">
                <button
                    type="button"
                    class="aba aba--ativa"
                    id="abaAtiva"
                    data-filtro="todos"
                >
                    <span data-pt="Todos" data-en="All">Todos</span> <span id="contadorTodos">(0)</span>
                </button>

                <button
                    type="button"
                    class="aba"
                    data-filtro="ativos"
                >
                    <span data-pt="Ativos" data-en="Active">Ativos</span> <span id="contadorAtivos">(0)</span>
                </button>

                <button
                    type="button"
                    class="aba"
                    data-filtro="alertas"
                >
                    <span data-pt="Alertas" data-en="Alerts">Alertas</span> <span id="contadorAlertas">(0)</span>
                </button>
            </div>

            <!-- ========================= -->
            <!-- GRID DE PACIENTES -->
            <!-- ========================= -->
            <section class="grid-pacientes">

                <!-- COLUNA ESQUERDA: pacientes com alertas altos -->
                <div class="coluna">
                    <h2 class="coluna-titulo" data-pt="Requer atenção" data-en="Requires attention">Requer atenção</h2>

                    <div id="listaAtencao">
                        <p class="carregando" data-pt="Carregando..." data-en="Loading...">Carregando...</p>
                    </div>

                    <p id="semAtencao" style="display:none" class="lista-vazia" data-pt="Nenhum paciente requer atenção no momento." data-en="No patients currently need attention.">
                        Nenhum paciente requer atenção no momento.
                    </p>
                </div>

                <!-- COLUNA DIREITA: pacientes em monitoramento normal -->
                <div class="coluna">
                    <h2 class="coluna-titulo" data-pt="Monitoramento regular" data-en="Regular monitoring">Monitoramento regular</h2>

                    <div id="listaRegular">
                        <p class="carregando" data-pt="Carregando..." data-en="Loading...">Carregando...</p>
                    </div>

                    <p id="semRegular" style="display:none" class="lista-vazia" data-pt="Nenhum paciente em monitoramento regular." data-en="No patients in regular monitoring.">
                        Nenhum paciente em monitoramento regular.
                    </p>
                </div>

            </section>

        </div><!-- fim .conteudo-corpo -->

    </main>

</div>


    <script src="/js/Pacientes.js"></script>


</body>
</html>
