<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bixuco — Meus Pacientes</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/tema.css">
    <link rel="stylesheet" href="/css/pacientes.css">

    <script src="https://translate.google.com/translate_a/element.js?cb=iniciarTradutor" async></script>
    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">

    <style>
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

    <div class="container">

        <!-- ========================= -->
        <!-- MENU LATERAL -->
        <!-- ========================= -->
        <aside class="sidebar">

            <div class="logo">
                <img src="/img/Logo_Colorida.png" alt="Logo Bixuco">
            </div>

            <nav>
                <a href="/homeTerapeuta">
                    <i class="fa-solid fa-house"></i>
                    <span>Início</span>
                </a>

                <a href="/relatoriosTerapeutaS">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Relatórios</span>
                </a>

                <a href="/configuracoesT">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configurações</span>
                </a>

                <a href="/sobreT">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Sobre</span>
                </a>

                <!-- aba ativa -->
                <a href="/pacientes" class="ativo">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Pacientes</span>
                </a>
            </nav>

            <div class="tema">
                <button id="btnClaro" class="ativo" type="button">
                    <i class="fa-regular fa-sun"></i>
                    Claro
                </button>
                <button id="btnEscuro" type="button">
                    <i class="fa-regular fa-moon"></i>
                    Escuro
                </button>
            </div>

            <div class="sidebar-divisor"></div>

            <a href="/logout" class="logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Sair</span>
            </a>

        </aside>

        <!-- ========================= -->
        <!-- CONTEÚDO PRINCIPAL -->
        <!-- ========================= -->
        <main class="conteudo">

            <!-- TOPO -->
            <header class="topo">

                <button class="tradutor" type="button" id="btnTraduzir">
                    <i class="fa-solid fa-globe"></i>
                    <span id="textoTradutor">Traduzir para inglês</span>
                </button>

                <!-- elemento oculto necessário para o Google Translate -->
                <div id="google_translate_element"
                    style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">
                </div>

                <div class="usuario">

                    <!-- sininho com painel de notificações -->
                    <div class="notificacoes-wrapper">
                        <button class="notificacoes" type="button" id="btnNotificacoes">
                            <i class="fa-regular fa-bell"></i>
                            <span id="badgeNotificacoes" class="badge" style="display:none">0</span>
                        </button>

                        <div class="painel-notificacoes" id="painelNotificacoes">
                            <div class="painel-header">Notificações</div>
                            <div id="listaNotificacoes">
                                <div class="painel-vazio">Carregando...</div>
                            </div>
                        </div>
                    </div>

                    <!-- foto clicável vai para o perfil do terapeuta -->
                    <img
                        id="fotoUsuario"
                        src="/img/perfilPadrao.png"
                        alt="Foto do terapeuta"
                        title="Ver perfil"
                        style="cursor:pointer;"
                        onclick="window.location.href='/perfilTerapeuta'"
                        onerror="this.src='/img/perfilPadrao.png'"
                    >

                    <div>
                        <h3 id="nomeTerapeuta">Carregando...</h3>
                        <span>Terapeuta</span>
                    </div>
                </div>

            </header>

            <!-- TÍTULO DA PÁGINA -->
            <h1 class="titulo-pagina">Meus pacientes</h1>

            <!-- BARRA DE BUSCA -->
            <div class="busca">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                    type="text"
                    id="inputBusca"
                    placeholder="Buscar pacientes..."
                    oninput="filtrarPacientes()"
                >
            </div>

            <!-- ABAS DE FILTRO -->
            <div class="abas">
                <button
                    type="button"
                    class="aba aba--ativa"
                    id="abaAtiva"
                    data-filtro="todos"
                    onclick="trocarAba(this)"
                >
                    Todos <span id="contadorTodos">(0)</span>
                </button>

                <button
                    type="button"
                    class="aba"
                    data-filtro="ativos"
                    onclick="trocarAba(this)"
                >
                    Ativos <span id="contadorAtivos">(0)</span>
                </button>

                <button
                    type="button"
                    class="aba"
                    data-filtro="alertas"
                    onclick="trocarAba(this)"
                >
                    Alertas <span id="contadorAlertas">(0)</span>
                </button>
            </div>

            <!-- ========================= -->
            <!-- GRID DE PACIENTES -->
            <!-- ========================= -->
            <section class="grid-pacientes">

                <!-- COLUNA ESQUERDA: pacientes com alertas altos -->
                <div class="coluna">
                    <h2 class="coluna-titulo">Requer atenção</h2>

                    <div id="listaAtencao">
                        <p class="carregando">Carregando...</p>
                    </div>

                    <p id="semAtencao" style="display:none" class="lista-vazia">
                        Nenhum paciente requer atenção no momento.
                    </p>
                </div>

                <!-- COLUNA DIREITA: pacientes em monitoramento normal -->
                <div class="coluna">
                    <h2 class="coluna-titulo">Monitoramento regular</h2>

                    <div id="listaRegular">
                        <p class="carregando">Carregando...</p>
                    </div>

                    <p id="semRegular" style="display:none" class="lista-vazia">
                        Nenhum paciente em monitoramento regular.
                    </p>
                </div>

            </section>

        </main>

    </div>


    <script>

        let todosPacientes = [];
        let filtroAtual    = "todos";


        // =========================
        // CARREGAR USUÁRIO (topo)
        // =========================
        async function carregarUsuario() {
            try {
                const resposta = await fetch("/api/home-terapeuta");
                if (resposta.status === 401) { window.location.href = "/logar"; return; }
                if (!resposta.ok) return;
                const dados = await resposta.json();

                document.getElementById("nomeTerapeuta").textContent = dados.nome || "Terapeuta";

                if (dados.fotoPerfil) {
                    document.getElementById("fotoUsuario").src = dados.fotoPerfil;
                }

                const badge = document.getElementById("badgeNotificacoes");
                if ((dados.notificacoes ?? 0) > 0) {
                    badge.textContent   = dados.notificacoes;
                    badge.style.display = "inline";
                }
            } catch (_) {}
        }


        // =========================
        // CARREGAR PACIENTES
        // =========================
        async function carregarPacientes() {
            try {
                const resposta = await fetch("/api/pacientes");

                if (resposta.status === 401) {
                    window.location.href = "/logar";
                    return;
                }

                if (!resposta.ok) throw new Error("Falha ao carregar pacientes");

                const dados = await resposta.json();

                todosPacientes = dados.pacientes || [];

                const comAlertas = todosPacientes.filter(p => p.alertas > 0);
                const ativos     = todosPacientes.filter(p => p.status === "ativo");

                document.getElementById("contadorTodos").textContent   = `(${todosPacientes.length})`;
                document.getElementById("contadorAtivos").textContent  = `(${ativos.length})`;
                document.getElementById("contadorAlertas").textContent = `(${comAlertas.length})`;

                renderPacientes(todosPacientes);

            } catch (erro) {
                console.log("Erro ao carregar pacientes:", erro);
                document.getElementById("listaAtencao").innerHTML = "";
                document.getElementById("listaRegular").innerHTML = "";
                document.getElementById("semAtencao").style.display = "block";
                document.getElementById("semRegular").style.display = "block";
            }
        }


        // =========================
        // RENDERIZAR CARDS
        // =========================
        function renderPacientes(lista) {
            const listaAtencao  = document.getElementById("listaAtencao");
            const listaRegular  = document.getElementById("listaRegular");

            listaAtencao.innerHTML = "";
            listaRegular.innerHTML = "";

            const atencao = lista.filter(p => p.alertas >= 3);
            const regular = lista.filter(p => p.alertas < 3);

            if (atencao.length === 0) {
                document.getElementById("semAtencao").style.display = "block";
            } else {
                document.getElementById("semAtencao").style.display = "none";
                atencao.forEach(p => listaAtencao.appendChild(criarCard(p, true)));
            }

            if (regular.length === 0) {
                document.getElementById("semRegular").style.display = "block";
            } else {
                document.getElementById("semRegular").style.display = "none";
                regular.forEach(p => listaRegular.appendChild(criarCard(p, false)));
            }
        }

        function criarCard(paciente, temAlerta) {
            const card = document.createElement("article");
            card.classList.add("card-paciente");
            if (temAlerta) card.classList.add("card-paciente--alerta");

            const badgeAlerta = temAlerta
                ? `<p class="badge-alerta">${paciente.alertas} alertas esta semana</p>`
                : "";

            const corEstresse = {
                "Alto":  "estresse--alto",
                "Médio": "estresse--medio",
                "Baixo": "estresse--baixo"
            }[paciente.nivelEstresse] || "";

            card.innerHTML = `
                ${badgeAlerta}

                <div class="card-cabecalho">
                    <img
                        src="${paciente.fotoPerfil || '/img/perfilPadrao.png'}"
                        alt="${paciente.nomeResponsavel}"
                        onerror="this.src='/img/perfilPadrao.png'"
                    >

                    <div class="card-info">
                        <strong>${paciente.nomeResponsavel}</strong>
                        <span>Criança: ${paciente.nomeCrianca}, ${paciente.idadeCrianca} anos</span>
                    </div>

                    <span class="status-badge status-badge--${paciente.status}">
                        ${paciente.status === "ativo" ? "Ativo" : "Inativo"}
                    </span>
                </div>

                <div class="card-metricas">
                    <div class="metrica">
                        <span>Alertas</span>
                        <strong class="metrica-valor metrica-valor--alerta">${paciente.alertas}</strong>
                    </div>
                    <div class="metrica">
                        <span>Estresse</span>
                        <strong class="metrica-valor ${corEstresse}">${paciente.nivelEstresse}</strong>
                    </div>
                    <div class="metrica">
                        <span>Último relat.</span>
                        <strong class="metrica-valor metrica-valor--data">${paciente.ultimoRelatorio}</strong>
                    </div>
                </div>

                <button
                    type="button"
                    class="btn-relatorio"
                    onclick="window.location.href='/relatoriosTerapeuta?paciente=${paciente.id}'"
                >
                    <i class="fa-regular fa-clipboard-list"></i>
                    Relatório
                </button>
            `;

            return card;
        }


        // =========================
        // FILTRAR POR ABA
        // =========================
        function trocarAba(botao) {
            document.querySelectorAll(".aba").forEach(b => b.classList.remove("aba--ativa"));
            botao.classList.add("aba--ativa");
            filtroAtual = botao.dataset.filtro;
            aplicarFiltros();
        }

        function filtrarPacientes() {
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const busca = document.getElementById("inputBusca").value.trim().toLowerCase();

            let lista = [...todosPacientes];

            if (filtroAtual === "ativos") {
                lista = lista.filter(p => p.status === "ativo");
            } else if (filtroAtual === "alertas") {
                lista = lista.filter(p => p.alertas > 0);
            }

            if (busca) {
                lista = lista.filter(p =>
                    p.nomeResponsavel.toLowerCase().includes(busca) ||
                    p.nomeCrianca.toLowerCase().includes(busca)
                );
            }

            renderPacientes(lista);
        }


        // =========================
        // NOTIFICAÇÕES
        // =========================
        const painelNotificacoes = document.getElementById("painelNotificacoes");
        const listaNotificacoes  = document.getElementById("listaNotificacoes");

        async function carregarNotificacoes() {
            try {
                const resposta = await fetch("/api/notificacoes");
                if (!resposta.ok) throw new Error();
                const dados = await resposta.json();
                const itens = dados.notificacoes || [];

                listaNotificacoes.innerHTML = itens.length === 0
                    ? `<div class="painel-vazio">Nenhuma notificação por enquanto.</div>`
                    : itens.map(item => `
                        <div class="item-notificacao ${item.lida ? "" : "nao-lida"}">
                            <p>${item.mensagem}</p>
                            <span class="tempo-notificacao">${item.tempo}</span>
                        </div>
                    `).join("");
            } catch (_) {
                listaNotificacoes.innerHTML = `<div class="painel-vazio">Não foi possível carregar.</div>`;
            }
        }

        document.getElementById("btnNotificacoes").addEventListener("click", async (e) => {
            e.stopPropagation();
            const estaAberto = painelNotificacoes.classList.toggle("aberto");
            if (estaAberto) {
                await carregarNotificacoes();
                fetch("/api/notificacoes/marcar-lidas", { method: "POST" });
                document.getElementById("badgeNotificacoes").style.display = "none";
            }
        });

        document.addEventListener("click", (e) => {
            if (!painelNotificacoes.contains(e.target)) {
                painelNotificacoes.classList.remove("aberto");
            }
        });


        // =========================
        // TRADUÇÃO
        // =========================
        function lerCookie(nome) {
            const valor  = `; ${document.cookie}`;
            const partes = valor.split(`; ${nome}=`);
            if (partes.length === 2) return partes.pop().split(";").shift();
            return null;
        }

        function iniciarTradutor() {
            new google.translate.TranslateElement(
                { pageLanguage: "pt", includedLanguages: "en", autoDisplay: false },
                "google_translate_element"
            );
        }

        function atualizarTextoBotao() {
            const cookieAtual = lerCookie("googtrans");
            document.getElementById("textoTradutor").textContent =
                cookieAtual && cookieAtual.includes("/en")
                    ? "Voltar para português"
                    : "Traduzir para inglês";
        }

        document.getElementById("btnTraduzir").addEventListener("click", () => {
            const cookieAtual   = lerCookie("googtrans");
            const estaTraduzido = cookieAtual && cookieAtual.includes("/en");
            const valor = `/pt/${estaTraduzido ? "pt" : "en"}`;
            document.cookie = `googtrans=${valor}; path=/`;
            document.cookie = `googtrans=${valor}; path=/; domain=${location.hostname}`;
            window.location.reload();
        });


        // =========================
        // TEMA
        // =========================
        function aplicarTema(tema) {
            document.body.classList.remove("tema-claro", "tema-escuro");
            document.body.classList.add(`tema-${tema}`);
            document.getElementById("btnClaro").classList.toggle("ativo", tema === "claro");
            document.getElementById("btnEscuro").classList.toggle("ativo", tema === "escuro");
            localStorage.setItem("tema", tema);
        }

        document.getElementById("btnClaro").addEventListener("click",  () => aplicarTema("claro"));
        document.getElementById("btnEscuro").addEventListener("click", () => aplicarTema("escuro"));


        // =========================
        // INICIALIZAÇÃO
        // =========================
        const temaSalvo = localStorage.getItem("tema") || "claro";
        aplicarTema(temaSalvo);
        atualizarTextoBotao();
        carregarUsuario();
        carregarPacientes();

    </script>

    <script src="/js/tema.js" onerror="console.log('tema.js não encontrado')"></script>

</body>
</html>
