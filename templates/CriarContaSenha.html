<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bixuco — Criar conta</title>

    <!-- Biblioteca de ícones -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <script src="/js/deeplink.js"></script>


    <!-- CSS da página -->
    <link
        rel="stylesheet"
        href="/css/criarcontasenha.css"
    >
    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">

</head>

<body>

    <main class="pagina-login">

        <!-- ========================= -->
        <!-- LADO ESQUERDO -->
        <!-- ========================= -->

        <section class="login-esquerda">

            <div class="login-esquerda__geometria"></div>
            <div class="login-esquerda__overlay"></div>

            <div class="login-esquerda__conteudo">

                <!-- Logo branca -->
                <img
                    src="/img/Logo_Branca.png"
                    alt="Logo Bixuco"
                    class="login-esquerda__logo"
                >

                <!-- Título -->
                <h1 class="login-esquerda__titulo">
                    Crie sua conta
                </h1>

                <!-- Texto -->
                <p class="login-esquerda__slogan">
                    Pais e terapeutas juntos pelo
                    bem-estar da criança.
                </p>

            </div>

            <!-- Ilustração -->
            <div class="login-esquerda__ilustracao-wrapper">

                <img
                    src="/img/familia-bixuco.png"
                    alt="Família utilizando o Bixuco"
                    class="login-esquerda__foto"
                >

            </div>

        </section>

        <!-- ========================= -->
        <!-- LADO DIREITO -->
        <!-- ========================= -->

        <section class="login-direita">

            <header class="criarconta-header">

                <h2 class="criarconta-titulo">
                    Criar conta
                </h2>

            </header>

            <div class="criarconta-corpo">

                <!-- Barra de progresso — etapa 3 de 3 (todas ativas) -->
                <div class="cadastro-progresso">

                    <span class="ativo"></span>
                    <span class="ativo"></span>
                    <span class="ativo ativo--recente"></span>

                </div>

                <!-- Título -->
                <h3 class="criarconta-pergunta">
                    Sobre sua segurança
                </h3>

                <!-- ========================= -->
                <!-- FORMULÁRIO -->
                <!-- ========================= -->

                <!-- Envio via fetch para exibir erros do servidor na tela -->
                <!-- sem recarregar a página ou redirecionar com ?erro= na URL -->
                <form id="formSenha" class="cadastro-form" novalidate>

                    <!-- Campo da senha -->
                    <div class="cadastro-form__grupo">

                        <label for="senha" class="cadastro-form__label">
                            Senha
                        </label>

                        <div class="cadastro-form__campo-senha">

                            <input
                                class="cadastro-form__input"
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="cadastro-form__toggle-senha"
                                onclick="toggleSenha('senha', 'iconeSenha')"
                                aria-label="Mostrar senha"
                            >

                                <i
                                    class="fa-solid fa-eye"
                                    id="iconeSenha"
                                ></i>

                            </button>

                        </div>

                        <span
                            class="cadastro-form__erro"
                            id="erro-senha"
                        ></span>

                    </div>

                    <!-- Confirmar senha -->
                    <div class="cadastro-form__grupo">

                        <label for="confirmarSenha" class="cadastro-form__label">
                            Confirmar senha
                        </label>

                        <div class="cadastro-form__campo-senha">

                            <input
                                class="cadastro-form__input"
                                type="password"
                                id="confirmarSenha"
                                name="confirmarSenha"
                                placeholder="Confirme sua senha"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="cadastro-form__toggle-senha"
                                onclick="toggleSenha('confirmarSenha', 'iconeConfirmarSenha')"
                                aria-label="Mostrar confirmação de senha"
                            >

                                <i
                                    class="fa-solid fa-eye"
                                    id="iconeConfirmarSenha"
                                ></i>

                            </button>

                        </div>

                        <span
                            class="cadastro-form__erro"
                            id="erro-confirmarSenha"
                        ></span>

                    </div>

                    <!-- Erro geral do servidor (substitui ?erro= na URL) -->
                    <span
                        id="erro-geral"
                        class="cadastro-form__erro cadastro-form__erro--geral"
                        style="display: none;"
                    ></span>

                    <button
                        type="submit"
                        id="btnContinuar"
                        class="btn-continuar"
                    >
                        Continuar
                    </button>

                </form>

                <!-- Termos -->
                <p class="cadastro-form__termos">

                    Ao criar sua conta você concorda com nossos

                    <a href="/termos" class="cadastro-form__link--azul">
                        Termos de uso
                    </a>

                    e

                    <a href="/privacidade" class="cadastro-form__link--verde">
                        Política de privacidade.
                    </a>

                </p>

            </div>

        </section>

    </main>

    <script>

        // ==========================
        // MOSTRAR / ESCONDER SENHA
        // ==========================

        function toggleSenha(inputId, iconeId) {

            const input = document.getElementById(inputId);
            const icone = document.getElementById(iconeId);

            if (input.type === "password") {

                input.type = "text";
                icone.classList.remove("fa-eye");
                icone.classList.add("fa-eye-slash");

            } else {

                input.type = "password";
                icone.classList.remove("fa-eye-slash");
                icone.classList.add("fa-eye");

            }

        }

        // ==========================
        // MOSTRAR / LIMPAR ERROS
        // ==========================

        // Usa innerHTML (em vez de textContent) para suportar a lista de
        // requisitos da senha com quebras de linha (<br>) — ver validarCampos()
        function mostrarErro(inputId, erroId, mensagem) {

            const input = document.getElementById(inputId);
            const erro  = document.getElementById(erroId);

            if (!input || !erro) {
                // Campo não existe nesta página (ex: erro de e-mail/CPF que
                // pertence a uma etapa anterior do cadastro) — mostra no
                // erro geral em vez de falhar silenciosamente
                const erroGeral = document.getElementById("erro-geral");
                if (erroGeral) {
                    erroGeral.textContent   = mensagem;
                    erroGeral.style.display = "block";
                }
                return;
            }

            input.classList.add("input-erro");
            erro.innerHTML     = mensagem;
            erro.style.display = "block";
            erro.dataset.jaTentou = "true";

            setTimeout(() => {
                input.classList.remove("input-erro");
            }, 500);

        }

        function limparErros() {

            ["senha", "confirmarSenha"].forEach(id => {

                const campo = document.getElementById(id);
                const erro  = document.getElementById("erro-" + id);

                if (campo) campo.classList.remove("input-erro");

                if (erro) {
                    erro.style.display = "none";
                    erro.textContent   = "";
                }

            });

            // Limpa o erro geral do servidor
            const erroGeral = document.getElementById("erro-geral");
            if (erroGeral) erroGeral.style.display = "none";

        }

        // ==========================
        // VALIDAÇÃO LOCAL
        // ==========================

        function validarCampos() {

            limparErros();
            let valido = true;

            const senha          = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;
            let erros = [];

            if (senha.length < 6) {
                erros.push(" -> A senha deve ter pelo menos 6 caracteres.");
            }

            if (!/[A-Z]/.test(senha)) {
                erros.push(" -> A senha deve conter pelo menos uma letra maiúscula.");
            }

            if (!/[!@#$%^&*(),.?":{}|<>_\-\\[\];'/+=]/.test(senha)) {
                erros.push(" -> A senha deve conter pelo menos um caractere especial.");
            }

            if (erros.length > 0) {

                mostrarErro(
                    "senha",
                    "erro-senha",
                    "A senha deve: " + "<br>" + erros.join("<br>")
                );

                valido = false;

            }

            // Verifica confirmação só se a senha já passou nas validações acima
            // Evita mostrar dois erros ao mesmo tempo quando a senha é inválida
            if (valido && senha !== confirmarSenha) {

                mostrarErro(
                    "confirmarSenha",
                    "erro-confirmarSenha",
                    "As senhas não coincidem."
                );

                valido = false;

            }

            return valido;

        }

        // ==========================
        // VALIDAÇÃO EM TEMPO REAL
        // ==========================

        const campoSenha = document.getElementById("senha");
        const campoConfirmar = document.getElementById("confirmarSenha");

        function senhaEhValida(valor) {
            return valor.length >= 6
                && /[A-Z]/.test(valor)
                && /[!@#$%^&*(),.?":{}|<>_\-\\[\];'/+=]/.test(valor);
        }

        campoSenha.addEventListener("input", () => {
            if (senhaEhValida(campoSenha.value)) {
                limparErroCampo("senha", "erro-senha");
            } else {
                // Se ja tinha passado por validacao (usuario tentou enviar) e agora ficou invalida de novo, mostra erro
                const erroEl = document.getElementById("erro-senha");
                if (erroEl && erroEl.dataset.jaTentou === "true") {
                    mostrarErro("senha", "erro-senha", "A senha ainda não atende aos requisitos.");
                }
            }
        });

        campoConfirmar.addEventListener("input", () => {
            const senha = campoSenha.value;
            const confirmar = campoConfirmar.value;

            if (confirmar && senha === confirmar) {
                limparErroCampo("confirmarSenha", "erro-confirmarSenha");
            } else if (confirmar) {
                const erroEl = document.getElementById("erro-confirmarSenha");
                if (erroEl && erroEl.dataset.jaTentou === "true") {
                    mostrarErro("confirmarSenha", "erro-confirmarSenha", "As senhas não coincidem.");
                }
            }
        });

        function limparErroCampo(inputId, erroId) {
            const input = document.getElementById(inputId);
            const erro  = document.getElementById(erroId);
            if (input) input.classList.remove("input-erro");
            if (erro) {
                erro.style.display = "none";
                erro.textContent   = "";
            }
        }

        // ==========================
        // ENVIO DO FORMULÁRIO
        // ==========================

        // Intercepta o submit e envia via fetch.
        // O backend responde em JSON com { sucesso, destino } no caso de êxito
        // (destino é /AdicionarC para pai ou /home para psicólogo),
        // ou { erro, campo } no caso de falha.
        document.getElementById("formSenha").addEventListener("submit", async (evento) => {

            evento.preventDefault();

            if (!validarCampos()) return;

            const btnContinuar = document.getElementById("btnContinuar");
            const erroGeral    = document.getElementById("erro-geral");

            // Desabilita o botão enquanto processa
            btnContinuar.disabled    = true;
            btnContinuar.textContent = "Criando conta...";

            try {

                const resposta = await fetch("/cadastro-finalizar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        senha:           document.getElementById("senha").value,
                        confirmarSenha:  document.getElementById("confirmarSenha").value
                    })
                });

                const dados = await resposta.json();

                if (dados.sucesso) {
                    window.location.href = dados.destino;
                    return;
                }

                if (!resposta.ok) {

                    if (dados.campo) {
                        mostrarErro(dados.campo, "erro-" + dados.campo, dados.erro);
                    } else {
                        erroGeral.textContent   = dados.erro || "Erro ao criar conta. Tente novamente.";
                        erroGeral.style.display = "block";
                    }

                }

            } catch (erro) {

                console.log("Erro na requisição:", erro);

                erroGeral.textContent   = "Erro de conexão. Verifique sua internet e tente novamente.";
                erroGeral.style.display = "block";

            } finally {

                // Reabilita o botão independente do resultado
                btnContinuar.disabled    = false;
                btnContinuar.textContent = "Continuar";

            }

        });

    </script>

    <script src="/js/tema.js"></script>

</body>
</html>
