<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bixuco — Vinculado!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="/css/tema.css">
<link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6fa;
    padding: 24px;
    transition: background 0.15s;
  }

  body.tema-escuro { background: #14161a; color: #f1f1f1; }

  #card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 20px;
  }

  #icon-wrap {
    width: 110px;
    height: 110px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: #dcfce7;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #icon-wrap i { font-size: 46px; color: #22c55e; }

  h1 { font-size: 24px; margin-bottom: 10px; }

  #subtitle {
    font-size: 14px;
    opacity: 0.75;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  #btn-inicio {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div id="card">
    <div id="icon-wrap">
      <i class="fa-solid fa-check"></i>
    </div>

    <h1 data-pt="Bixuco vinculado!" data-en="Bixuco linked!">Bixuco vinculado!</h1>
    <p id="subtitle" data-pt="Tudo pronto. Agora vocês estão prontos para começar a jornada juntos." data-en="All set. You're both ready to start the journey together.">
      Tudo pronto. Agora vocês estão prontos para começar a jornada juntos.
    </p>

    <button id="btn-inicio" type="button" data-pt="Ir para o início" data-en="Go to home">Ir para o início</button>
  </div>

<script>
  // Respeita o tema salvo, já que essa tela não tem o toggle de tema
  const temaSalvo = localStorage.getItem("tema") || "claro";
  document.body.classList.add(`tema-${temaSalvo}`);

  // Aplica a tradução manual salva, já que essa tela não tem botão de traduzir próprio
  const idiomaAtual = localStorage.getItem("idioma") || "pt";
  if (idiomaAtual === "en") {
    document.querySelectorAll("[data-pt]").forEach(el => {
      el.textContent = el.dataset.en || el.dataset.pt;
    });
  }

  document.getElementById('btn-inicio').addEventListener('click', () => {
    window.location.href = '/home';
  });
</script>

</body>
</html>
