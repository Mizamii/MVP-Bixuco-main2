<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bixuco — Login</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="/css/login.css"
    >
    <script src="/js/deeplink.js"></script>


    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">
</head>

<body>

    <main class="pagina-login">

        <!-- ========================= -->
        <!-- LADO ESQUERDO -->
        <!-- ========================= -->
        <section class="login-esquerda">

            <div class="login-esquerda__geometria"></div>
            <div class="login-esquerda__overlay"></div>

            <div class="login-esquerda__conteudo">
                <img
                    src="/img/Logo_Branca.png"
                    alt="Logo Bixuco"
                    class="login-esquerda__logo"
                >

                <h1 class="login-esquerda__titulo">
                    <span data-pt="Acompanhamento" data-en="Smart child">Acompanhamento</span>
                    <br>
                    <span data-pt="infantil" data-en="tracking,">infantil</span>
                    <span class="destaque" data-pt="inteligente." data-en="made simple.">inteligente.</span>
                </h1>

                <p
                    class="login-esquerda__slogan"
                    data-pt="Mais organização, mais conexão e mais cuidado para famílias e terapeutas."
                    data-en="More organization, more connection and more care for families and therapists."
                >
                    Mais organização, mais conexão e mais cuidado
                    para famílias e terapeutas.
                </p>
            </div>

            <div class="login-esquerda__ilustracao-wrapper">
                <img
                    src="/img/login-urso.png"
                    alt="Foto da criança com o Bixuco"
                    class="login-esquerda__foto"
                >
            </div>

        </section>

        <!-- ========================= -->
        <!-- LADO DIREITO -->
        <!-- ========================= -->
        <section class="login-direita">

            <button type="button" class="tradutor tradutor--login" id="btnTraduzir">
                <i class="fa-solid fa-language"></i>
                <span id="textoTradutor">Traduzir para o inglês</span>
            </button>

            <div class="login-direita__logo-container">
                <img
                    src="/img/logo-bixuco-colorida.png"
                    alt="Logo Bixuco"
                    class="login-direita__logo"
                >
            </div>

            <h2 class="login-direita__titulo">
                <span
                    class="login-direita__titulo-base"
                    data-pt="Bem-vindo"
                    data-en="Welcome"
                >Bem-vindo</span>
                <span
                    class="login-direita__titulo--destaque"
                    data-pt="de volta!"
                    data-en="back!"
                >de volta!</span>
            </h2>

            <p
                class="login-direita__subtitulo"
                data-pt="Acesse sua conta para continuar"
                data-en="Sign in to continue"
            >
                Acesse sua conta para continuar
            </p>

            <form id="formLogin" class="login-form" novalidate>

                <!-- Email -->
                <div class="login-form__campo">
                    <label for="email" class="login-form__label" data-pt="Email" data-en="Email">
                        Email
                    </label>

                    <div class="login-form__input-wrapper">
                        <input
                            class="login-form__input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            data-pt-placeholder="Digite seu e-mail"
                            data-en-placeholder="Enter your email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <span
                        class="login-form__erro"
                        id="erro-email"
                    ></span>
                </div>

                <!-- Senha -->
                <div class="login-form__campo">
                    <div class="login-form__senha-cabecalho">
                        <label for="senha" class="login-form__label" data-pt="Senha" data-en="Password">
                            Senha
                        </label>

                        <a
                            href="/EsqueceuSenha"
                            class="login-form__esqueci-senha"
                            data-pt="Esqueci minha senha"
                            data-en="Forgot my password"
                        >
                            Esqueci minha senha
                        </a>
                    </div>

                    <div class="login-form__input-wrapper">
                        <input
                            class="login-form__input"
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            data-pt-placeholder="Digite sua senha"
                            data-en-placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="login-form__toggle-senha"
                            id="btnToggleSenha"
                            aria-label="Mostrar senha"
                        >
                            <i
                                class="fa-solid fa-eye"
                                id="iconeSenha"
                            ></i>
                        </button>
                    </div>

                    <span
                        class="login-form__erro"
                        id="erro-senha"
                    ></span>
                </div>



                <span
                    class="login-form__erro login-form__erro--geral"
                    id="erro-geral"
                ></span>

                <button
                    type="submit"
                    id="btnEntrar"
                    class="login-form__btn-entrar"
                    data-pt="Entrar"
                    data-en="Log in"
                >
                    Entrar
                </button>

            </form>

            <div class="login-divisor">
                <span class="login-divisor__linha"></span>
                <p class="login-divisor__texto" data-pt="ou" data-en="or">ou</p>
                <span class="login-divisor__linha"></span>
            </div>

            <button type="button" class="login-google" id="btnLoginGoogle">
                <img
                    src="/img/google.webp"
                    alt="Google"
                >
                <span data-pt="Continuar com Google" data-en="Continue with Google">Continuar com Google</span>
            </button>

            <div class="login-criar-conta">
                <p data-pt="Não tem conta?" data-en="Don't have an account?">
                    Não tem conta?
                </p>
                <a
                    href="/CriarContaS"
                    class="login-criar-conta__link"
                    data-pt="Criar agora"
                    data-en="Sign up now"
                >
                    Criar agora
                </a>
            </div>

        </section>
    </main>

    <script src="/js/logar.js"></script>


</body>
</html>
