<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bixuco — Login</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="/css/login.css"
    >
    <script src="/js/deeplink.js"></script>


    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">
</head>

<body>

    <main class="pagina-login">

        <!-- ========================= -->
        <!-- LADO ESQUERDO -->
        <!-- ========================= -->
        <section class="login-esquerda">

            <div class="login-esquerda__geometria"></div>
            <div class="login-esquerda__overlay"></div>

            <div class="login-esquerda__conteudo">
                <img
                    src="/img/Logo_Branca.png"
                    alt="Logo Bixuco"
                    class="login-esquerda__logo"
                >

                <h1 class="login-esquerda__titulo">
                    Acompanhamento
                    <br>
                    infantil
                    <span>inteligente.</span>
                </h1>

                <p class="login-esquerda__slogan">
                    Mais organização, mais conexão e mais cuidado
                    para famílias e terapeutas.
                </p>
            </div>

            <div class="login-esquerda__ilustracao-wrapper">
                <img
                    src="/img/login-urso.png"
                    alt="Foto da criança com o Bixuco"
                    class="login-esquerda__foto"
                >
            </div>

        </section>

        <!-- ========================= -->
        <!-- LADO DIREITO -->
        <!-- ========================= -->
        <section class="login-direita">

            <div class="login-direita__logo-container">
                <img
                    src="/img/logo-bixuco-colorida.png"
                    alt="Logo Bixuco"
                    class="login-direita__logo"
                >
            </div>

            <h2 class="login-direita__titulo">
                Bem-vindo
                <span class="login-direita__titulo--destaque">de volta!</span>
            </h2>

            <p class="login-direita__subtitulo">
                Acesse sua conta para continuar
            </p>

            <form id="formLogin" class="login-form" novalidate>

                <!-- Email -->
                <div class="login-form__campo">
                    <label for="email" class="login-form__label">
                        Email
                    </label>

                    <div class="login-form__input-wrapper">
                        <input
                            class="login-form__input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <span
                        class="login-form__erro"
                        id="erro-email"
                    ></span>
                </div>

                <!-- Senha -->
                <div class="login-form__campo">
                    <div class="login-form__senha-cabecalho">
                        <label for="senha" class="login-form__label">
                            Senha
                        </label>

                        <a href="/EsqueceuSenha" class="login-form__esqueci-senha">
                            Esqueci minha senha
                        </a>
                    </div>

                    <div class="login-form__input-wrapper">
                        <input
                            class="login-form__input"
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="login-form__toggle-senha"
                            id="btnToggleSenha"
                            aria-label="Mostrar senha"
                        >
                            <i
                                class="fa-solid fa-eye"
                                id="iconeSenha"
                            ></i>
                        </button>
                    </div>

                    <span
                        class="login-form__erro"
                        id="erro-senha"
                    ></span>
                </div>

                

                <span
                    class="login-form__erro login-form__erro--geral"
                    id="erro-geral"
                ></span>

                <button
                    type="submit"
                    id="btnEntrar"
                    class="login-form__btn-entrar"
                >
                    Entrar
                </button>

            </form>

            <div class="login-divisor">
                <span class="login-divisor__linha"></span>
                <p class="login-divisor__texto">ou</p>
                <span class="login-divisor__linha"></span>
            </div>

            <button type="button" class="login-google" id="btnLoginGoogle">
                <img
                    src="/img/google.webp"
                    alt="Google"
                >
                <span>Continuar com Google</span>
            </button>

            <div class="login-criar-conta">
                <p>
                    Não tem conta?
                </p>
                <a href="/CriarContaS" class="login-criar-conta__link">
                    Criar agora
                </a>
            </div>

        </section>
    </main>

    <script src="/js/logar.js"></script>


</body>
</html>
