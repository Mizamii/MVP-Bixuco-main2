<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Bixuco — Criar conta</title>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link
        rel="stylesheet"
        href="/css/criarcontag.css"
    >

    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">
</head>

<body>
    <main class="pagina-login">

        <!-- ========================= -->
        <!-- LADO ESQUERDO -->
        <!-- ========================= -->
        <section class="login-esquerda">

            <div class="login-esquerda__geometria"></div>
            <div class="login-esquerda__overlay"></div>

            <div class="login-esquerda__conteudo">
                <!-- Logo branca -->
                <img
                    src="/img/Logo_Branca.png"
                    alt="Logo Bixuco"
                    class="login-esquerda__logo"
                >

                <!-- Título -->
                <h1 class="login-esquerda__titulo">
                    Crie sua conta
                </h1>

                <!-- Texto -->
                <p class="login-esquerda__slogan">
                    Pais e terapeutas juntos pelo
                    bem-estar da criança.
                </p>
            </div>

            <div class="login-esquerda__ilustracao-wrapper">
                <img
                    src="/img/familia-bixuco.png"
                    alt="Família utilizando o Bixuco"
                    class="login-esquerda__foto"
                >
            </div>

        </section>

        <!-- ========================= -->
        <!-- LADO DIREITO -->
        <!-- ========================= -->
        <section class="login-direita">

            <header class="criarconta-header">
                <h2 class="criarconta-titulo">
                    Criar conta
                </h2>
            </header>

            <div class="criarconta-corpo">

                <!-- Barra de progresso (Etapa 2) -->
                <div class="cadastro-progresso">
                    <span class="ativo"></span>
                    <span class="ativo ativo--recente"></span>
                    <span></span>
                </div>

                <h3 class="criarconta-pergunta">
                    Informações sobre você
                </h3>

                <!-- ========================= -->
                <!-- FORMULÁRIO -->
                <!-- ========================= -->

                <!-- Envio via fetch para poder exibir erros do servidor na tela -->
                <form id="formCadastro" class="cadastro-form" novalidate>

                    <!-- Nome -->
                    <div class="cadastro-form__grupo">
                        <label for="nome" class="cadastro-form__label">
                            Nome completo
                        </label>
                        <input
                            class="cadastro-form__input"
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >
                        <span
                            class="cadastro-form__erro"
                            id="erro-nome"
                        ></span>
                    </div>

                    <!-- Email -->
                    <div class="cadastro-form__grupo">
                        <label for="email" class="cadastro-form__label">
                            Email
                        </label>
                        <input
                            class="cadastro-form__input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                        <span
                            class="cadastro-form__erro"
                            id="erro-email"
                        ></span>
                    </div>

                    <!-- Linha telefone + data -->
                    <div class="cadastro-form__linha">

                        <!-- Telefone -->
                        <div class="cadastro-form__grupo">
                            <label for="telefone" class="cadastro-form__label">
                                Telefone (opcional)
                            </label>
                            <input
                                class="cadastro-form__input"
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(00) 00000-0000"
                                autocomplete="tel"
                            >
                            <span
                                class="cadastro-form__erro"
                                id="erro-telefone"
                            ></span>
                        </div>

                        <!-- Data de nascimento -->
                        <div class="cadastro-form__grupo">
                            <label for="dataNascimento" class="cadastro-form__label">
                                Data de nascimento
                            </label>
                            <input
                                class="cadastro-form__input"
                                type="date"
                                id="dataNascimento"
                                name="dataNascimento"
                                required
                            >
                            <span
                                class="cadastro-form__erro"
                                id="erro-dataNascimento"
                            ></span>
                        </div>

                    </div>

                    <!-- CPF -->
                    <div class="cadastro-form__grupo">
                        <label for="cpf" class="cadastro-form__label">
                            CPF
                        </label>
                        <input
                            class="cadastro-form__input"
                            type="text"
                            id="cpf"
                            name="cpfUser"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            inputmode="numeric"
                            oninput="mascaraCPF(this)"
                            required
                        >
                        <span
                            class="cadastro-form__erro"
                            id="erro-cpf"
                        ></span>
                    </div>

                    <!-- ========================= -->
                    <!-- Campos de endereço que o backend espera -->
                    <!-- /continuar-cadastro-pai desestrutura cep, cidade, estado, bairro -->
                    <!-- ========================= -->

                    <!-- CEP -->
                    <!-- CEP -->
                    <div class="cadastro-form__grupo">
                        <label for="cep" class="cadastro-form__label">
                            CEP
                        </label>
                        <input
                            class="cadastro-form__input"
                            type="text"
                            id="cep"
                            name="cep"
                            placeholder="00000-000"
                            maxlength="9"
                            inputmode="numeric"
                            oninput="mascaraCEP(this)"
                            required
                        >
                        <span class="cadastro-form__erro" id="erro-cep"></span>
                    </div>

                    <!-- Rua -->
                    <div class="cadastro-form__grupo">
                        <label for="rua" class="cadastro-form__label">
                            Rua
                        </label>
                        <input
                            class="cadastro-form__input"
                            type="text"
                            id="rua"
                            name="rua"
                            placeholder="Sua rua"
                            autocomplete="address-line1"
                            required
                            readonly
                        >
                        <span class="cadastro-form__erro" id="erro-rua"></span>
                    </div>

                    <!-- Linha número + complemento -->
                    <div class="cadastro-form__linha">

                        <!-- Número -->
                        <div class="cadastro-form__grupo">
                            <label for="numero" class="cadastro-form__label">
                                Número
                            </label>
                            <input
                                class="cadastro-form__input"
                                type="text"
                                id="numero"
                                name="numero"
                                placeholder="Nº"
                                inputmode="numeric"
                                required
                            >
                            <span class="cadastro-form__erro" id="erro-numero"></span>
                        </div>

                        <!-- Complemento -->
                        <div class="cadastro-form__grupo">
                            <label for="complemento" class="cadastro-form__label">
                                Complemento (opcional)
                            </label>
                            <input
                                class="cadastro-form__input"
                                type="text"
                                id="complemento"
                                name="complemento"
                                placeholder="Apto, bloco, etc."
                            >
                        </div>

                    </div>

                    <!-- Linha cidade + estado -->
                    <div class="cadastro-form__linha">

                        <!-- Cidade -->
                        <div class="cadastro-form__grupo">
                            <label for="cidade" class="cadastro-form__label">
                                Cidade
                            </label>
                            <input
                                class="cadastro-form__input"
                                type="text"
                                id="cidade"
                                name="cidade"
                                placeholder="Sua cidade"
                                autocomplete="address-level2"
                                required
                                readonly
                            >
                            <span class="cadastro-form__erro" id="erro-cidade"></span>
                        </div>

                        <!-- Estado -->
                        <div class="cadastro-form__grupo">
                            <label for="estado" class="cadastro-form__label">
                                Estado
                            </label>
                            <input
                                class="cadastro-form__input"
                                type="text"
                                id="estado"
                                name="estado"
                                placeholder="UF"
                                maxlength="2"
                                autocomplete="address-level1"
                                required
                                readonly
                            >
                            <span class="cadastro-form__erro" id="erro-estado"></span>
                        </div>

                    </div>

                    <!-- Bairro -->
                    <div class="cadastro-form__grupo">
                        <label for="bairro" class="cadastro-form__label">
                            Bairro
                        </label>
                        <input
                            class="cadastro-form__input"
                            type="text"
                            id="bairro"
                            name="bairro"
                            placeholder="Seu bairro"
                            required
                            readonly
                        >
                        <span
                            class="cadastro-form__erro"
                            id="erro-bairro"
                        ></span>
                    </div>

                    <!-- Erro geral do servidor (substitui o sistema de ?erro= na URL) -->
                    <span
                        id="erro-geral"
                        class="cadastro-form__erro cadastro-form__erro--geral"
                        style="display: none;"
                    ></span>

                    <button
                        type="submit"
                        id="btnContinuar"
                        class="btn-continuar"
                    >
                        Continuar
                    </button>

                </form>

                <!-- Termos -->
                <p class="cadastro-form__termos">
                    Ao criar sua conta você concorda com nossos
                    <a href="/termos" class="cadastro-form__link--azul">Termos de uso</a>
                    e
                    <a href="/privacidade" class="cadastro-form__link--verde">Política de privacidade.</a>
                </p>

            </div>

        </section>

    </main>

    <script>

        // ==========================
        // MÁSCARA DO CPF
        // ==========================

        function mascaraCPF(input) {

            let valor = input.value.replace(/\D/g, "").slice(0, 11);

            if (valor.length > 9) {
                valor = valor.replace(
                    /(\d{3})(\d{3})(\d{3})(\d{0,2})/,
                    "$1.$2.$3-$4"
                );
            } else if (valor.length > 6) {
                valor = valor.replace(
                    /(\d{3})(\d{3})(\d{0,3})/,
                    "$1.$2.$3"
                );
            } else if (valor.length > 3) {
                valor = valor.replace(
                    /(\d{3})(\d{0,3})/,
                    "$1.$2"
                );
            }

            input.value = valor;

        }

        // ==========================
        // MÁSCARA DO TELEFONE
        // ==========================

        document.getElementById("telefone").addEventListener("input", function () {

            let valor = this.value.replace(/\D/g, "").slice(0, 11);

            if (valor.length > 10) {
                valor = valor.replace(
                    /(\d{2})(\d{5})(\d{4})/,
                    "($1) $2-$3"
                );
            } else if (valor.length > 6) {
                valor = valor.replace(
                    /(\d{2})(\d{4})(\d+)/,
                    "($1) $2-$3"
                );
            } else if (valor.length > 2) {
                valor = valor.replace(
                    /(\d{2})(\d+)/,
                    "($1) $2"
                );
            }

            this.value = valor;

        });

        // ==========================
        // MÁSCARA DO CEP
        // ==========================

        function mascaraCEP(input) {

            let valor = input.value.replace(/\D/g, "").slice(0, 8);

            if (valor.length > 5) {
                valor = valor.replace(/(\d{5})(\d{0,3})/, "$1-$2");
            }

            input.value = valor;

        }

        // ==========================
        // BUSCA CEP AUTOMATICAMENTE
        // ==========================

        // Ao digitar o CEP completo, busca cidade/estado/bairro
        // automaticamente via API ViaCEP e preenche os campos readonly
        document.getElementById("cep").addEventListener("blur", async function () {

            const cep = this.value.replace(/\D/g, "");

            if (cep.length !== 8) return;

            try {

                const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const dados = await resposta.json();

                if (dados.erro) {

                    mostrarErro("cep", "erro-cep", "CEP não encontrado.");
                    return;

                }

                document.getElementById("rua").value     = dados.logradouro || "";
                document.getElementById("cidade").value  = dados.localidade || "";
                document.getElementById("estado").value  = dados.uf || "";
                document.getElementById("bairro").value  = dados.bairro || "";

                // Se o CEP nao tiver rua definida (comum em cidades pequenas), libera edicao manual
                if (!dados.logradouro) {
                    document.getElementById("rua").removeAttribute("readonly");
                }

                document.getElementById("bairro").removeAttribute("readonly");

                limparErroCampo("cep", "erro-cep");
                limparErroCampo("rua", "erro-rua");
                limparErroCampo("cidade", "erro-cidade");
                limparErroCampo("estado", "erro-estado");
                limparErroCampo("bairro", "erro-bairro");

            } catch (erro) {

                console.log("Erro ao buscar CEP:", erro);

            }

        });

        // ==========================
        // MOSTRAR / LIMPAR ERROS
        // ==========================

        function mostrarErro(inputId, erroId, mensagem) {

            const input = document.getElementById(inputId);
            const erro  = document.getElementById(erroId);

            if (!input || !erro) return;

            input.classList.add("input-erro");
            erro.textContent  = mensagem;
            erro.style.display = "block";

            setTimeout(() => {
                input.classList.remove("input-erro");
            }, 500);

        }

        function limparErros() {

            [
                "nome",
                "email",
                "telefone",
                "dataNascimento",
                "cpf",
                "cep",
                "cidade",
                "estado",
                "bairro"
            ].forEach(id => {

                const campo = document.getElementById(id);
                const erro  = document.getElementById("erro-" + id);

                if (campo) campo.classList.remove("input-erro");
                if (erro) {
                    erro.style.display = "none";
                    erro.textContent   = "";
                }

            });

            // Limpa também o erro geral
            const erroGeral = document.getElementById("erro-geral");
            if (erroGeral) erroGeral.style.display = "none";

        }

        // ==========================
        // LIMPAR ERRO DE UM ÚNICO CAMPO
        // (usado na validação em tempo real, sem precisar dar Enter)
        // ==========================

        function limparErroCampo(inputId, erroId) {

            const input = document.getElementById(inputId);
            const erro  = document.getElementById(erroId);

            if (input) input.classList.remove("input-erro");

            if (erro) {
                erro.style.display = "none";
                erro.textContent   = "";
            }

        }

        // ==========================
        // DEBOUNCE — espera o usuário parar de digitar
        // antes de consultar o servidor
        // ==========================

        function debounce(funcao, atraso = 600) {

            let temporizador;

            return (...args) => {
                clearTimeout(temporizador);
                temporizador = setTimeout(() => funcao(...args), atraso);
            };

        }

        // ==========================
        // CHECAR NO SERVIDOR SE EMAIL/CPF JÁ ESTÃO EM USO
        // ==========================

        async function verificarDisponibilidade(campo, valor) {

            try {

                const resposta = await fetch("/api/verificar-disponibilidade", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ campo, valor })
                });

                if (!resposta.ok) return true;

                const dados = await resposta.json();
                return dados.disponivel !== false;

            } catch (erro) {

                console.log("Erro ao verificar disponibilidade:", erro);
                return true; // não trava o usuário por erro de conexão

            }

        }

        // ==========================
        // FORMATO DO CPF (sem checar dígito verificador —
        // isso o backend já faz com a lib cpf-cnpj-validator)
        // ==========================

        function cpfFormatoValido(cpfLimpo) {
            return cpfLimpo.length === 11 && !/^(\d)\1{10}$/.test(cpfLimpo);
        }

        // ==========================
        // VERIFICAR MAIOR DE IDADE
        // ==========================

        function maiorIdade(data) {

            const hoje       = new Date();
            const nascimento = new Date(data);
            let   idade      = hoje.getFullYear() - nascimento.getFullYear();
            const mes        = hoje.getMonth() - nascimento.getMonth();

            if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
                idade--;
            }

            return idade >= 18;

        }

        // ==========================
        // VALIDAÇÃO LOCAL
        // ==========================

        function validarCampos() {

            limparErros();
            let valido = true;

            const nome          = document.getElementById("nome").value.trim();
            const email         = document.getElementById("email").value.trim();
            const telefone      = document.getElementById("telefone").value.trim();
            const data          = document.getElementById("dataNascimento").value;
            const cpf           = document.getElementById("cpf").value.replace(/\D/g, "");
            const cep           = document.getElementById("cep").value.replace(/\D/g, "");
            const cidade        = document.getElementById("cidade").value.trim();
            const estado        = document.getElementById("estado").value.trim();
            const bairro        = document.getElementById("bairro").value.trim();

            const regexEmail    = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (nome.split(" ").filter(p => p).length < 2) {
                mostrarErro("nome", "erro-nome", "Digite seu nome completo.");
                valido = false;
            }

            if (!regexEmail.test(email)) {
                mostrarErro("email", "erro-email", "Digite um e-mail válido.");
                valido = false;
            }

            if (telefone && telefone.replace(/\D/g, "").length < 10) {
                mostrarErro("telefone", "erro-telefone", "Telefone inválido.");
                valido = false;
            }

            if (!data) {
                mostrarErro("dataNascimento", "erro-dataNascimento", "Informe sua data de nascimento.");
                valido = false;
            } else if (!maiorIdade(data)) {
                mostrarErro("dataNascimento", "erro-dataNascimento", "Você precisa ter pelo menos 18 anos.");
                valido = false;
            }

            // Validação mais descritiva do CPF
            // O backend tem a validação real com dígitos verificadores
            // aqui garantimos pelo menos o formato correto
            if (!cpfFormatoValido(cpf)) {
                mostrarErro("cpf", "erro-cpf", "CPF inválido. Verifique os números digitados.");
                valido = false;
            }

            if (cep.length !== 8) {
                mostrarErro("cep", "erro-cep", "Digite um CEP válido.");
                valido = false;
            }

            if (!cidade) {
                mostrarErro("cidade", "erro-cidade", "Cidade não encontrada. Verifique o CEP.");
                valido = false;
            }

            if (!estado) {
                mostrarErro("estado", "erro-estado", "Estado não encontrado. Verifique o CEP.");
                valido = false;
            }

            if (!bairro) {
                mostrarErro("bairro", "erro-bairro", "Informe seu bairro.");
                valido = false;
            }
            const numero = document.getElementById("numero").value.trim();

            if (!numero) {
                mostrarErro("numero", "erro-numero", "Informe o número.");
                valido = false;
            }

            return valido;

        }

        // ==========================
        // VALIDAÇÃO EM TEMPO REAL
        // (o erro some assim que o campo fica válido — não precisa
        // apertar Enter nem clicar em Continuar)
        // ==========================

        const campoNome  = document.getElementById("nome");
        const campoEmail = document.getElementById("email");
        const campoTel   = document.getElementById("telefone");
        const campoData  = document.getElementById("dataNascimento");
        const campoCPF   = document.getElementById("cpf");
        const campoCEP   = document.getElementById("cep");
        const campoBairroLive = document.getElementById("bairro");

        const regexEmailLive = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        campoNome.addEventListener("input", () => {
            const partes = campoNome.value.trim().split(" ").filter(p => p);
            if (partes.length >= 2) limparErroCampo("nome", "erro-nome");
        });

        // Checa disponibilidade do email só depois que o formato já está
        // válido e o usuário parou de digitar por um instante
        const checarEmailDisponivel = debounce(async () => {

            const valor = campoEmail.value.trim();
            if (!regexEmailLive.test(valor)) return;

            const disponivel = await verificarDisponibilidade("email", valor);

            // se o usuário já mudou o valor enquanto a resposta chegava, ignora
            if (campoEmail.value.trim() !== valor) return;

            if (!disponivel) {
                mostrarErro("email", "erro-email", "Este e-mail já está cadastrado.");
            } else {
                limparErroCampo("email", "erro-email");
            }

        });

        campoEmail.addEventListener("input", () => {
            if (regexEmailLive.test(campoEmail.value.trim())) {
                limparErroCampo("email", "erro-email");
                checarEmailDisponivel();
            }
        });

        campoTel.addEventListener("input", () => {
            const numeros = campoTel.value.replace(/\D/g, "");
            if (numeros.length === 0 || numeros.length >= 10) {
                limparErroCampo("telefone", "erro-telefone");
            }
        });

        campoData.addEventListener("input", () => {
            if (campoData.value && maiorIdade(campoData.value)) {
                limparErroCampo("dataNascimento", "erro-dataNascimento");
            }
        });

        // Mesma ideia para o CPF: valida o formato e, se estiver certo,
        // pergunta ao servidor se já está em uso
        const checarCPFDisponivel = debounce(async () => {

            const valor   = campoCPF.value.trim();
            const numeros = valor.replace(/\D/g, "");
            if (!cpfFormatoValido(numeros)) return;

            const disponivel = await verificarDisponibilidade("cpf", valor);

            if (campoCPF.value.trim() !== valor) return;

            if (!disponivel) {
                mostrarErro("cpf", "erro-cpf", "Este CPF já está cadastrado.");
            } else {
                limparErroCampo("cpf", "erro-cpf");
            }

        });

        campoCPF.addEventListener("input", () => {
            const numeros = campoCPF.value.replace(/\D/g, "");
            if (cpfFormatoValido(numeros)) {
                limparErroCampo("cpf", "erro-cpf");
                checarCPFDisponivel();
            }
        });

        let cepJaFoiValido = false;

        campoCEP.addEventListener("input", () => {
            const numeros = campoCEP.value.replace(/\D/g, "");

            if (numeros.length === 8) {
                limparErroCampo("cep", "erro-cep");
                cepJaFoiValido = true;
            } else if (cepJaFoiValido) {
                // Já tinha ficado valido antes, e agora foi apagado/alterado - mostra erro de novo
                mostrarErro("cep", "erro-cep", "Digite um CEP válido.");
                cepJaFoiValido = false;
            }
        });

        campoBairroLive.addEventListener("input", () => {
            if (campoBairroLive.value.trim()) limparErroCampo("bairro", "erro-bairro");
        });

        document.getElementById("numero").addEventListener("input", () => {
            if (document.getElementById("numero").value.trim()) {
                limparErroCampo("numero", "erro-numero");
            }
        });

        // ==========================
        // ENVIO DO FORMULÁRIO
        // ==========================

        // Intercepta o submit e envia via fetch
        // Antes o form fazia POST direto e erros chegavam via ?erro= na URL
        // Agora os erros aparecem direto nos campos sem sair da página

        document.getElementById("formCadastro").addEventListener("submit", async (evento) => {

            evento.preventDefault();

            if (!validarCampos()) return;

            const btnContinuar = document.getElementById("btnContinuar");
            const erroGeral    = document.getElementById("erro-geral");

            // Desabilita o botão enquanto processa
            btnContinuar.disabled    = true;
            btnContinuar.textContent = "Enviando...";

            try {

                const resposta = await fetch("/continuar-cadastro-pai", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome:           document.getElementById("nome").value.trim(),
                        email:          document.getElementById("email").value.trim(),
                        telefone:       document.getElementById("telefone").value.trim(),
                        dataNascimento: document.getElementById("dataNascimento").value,
                        cpfUser:        document.getElementById("cpf").value,
                        cep:            document.getElementById("cep").value,
                        rua:            document.getElementById("rua").value.trim(),
                        numero:         document.getElementById("numero").value.trim(),
                        complemento:    document.getElementById("complemento").value.trim(),
                        cidade:         document.getElementById("cidade").value.trim(),
                        estado:         document.getElementById("estado").value.trim(),
                        bairro:         document.getElementById("bairro").value.trim()
                    })
                });

                // Redirecionamento bem-sucedido (backend redireciona para /CriarContaSenha)
                if (resposta.redirected) {
                    window.location.href = resposta.url;
                    return;
                }

                // Exibe erros do servidor direto nos campos
                if (!resposta.ok) {

                    const dados = await resposta.json();

                    // Tenta mostrar no campo específico, senão mostra no geral
                    if (dados.campo) {
                        mostrarErro(dados.campo, "erro-" + dados.campo, dados.erro);
                    } else {
                        erroGeral.textContent  = dados.erro || "Erro ao continuar. Tente novamente.";
                        erroGeral.style.display = "block";
                    }

                }

            } catch (erro) {

                console.log("Erro na requisição:", erro);

                erroGeral.textContent  = "Erro de conexão. Verifique sua internet e tente novamente.";
                erroGeral.style.display = "block";

            } finally {

                // Reabilita o botão independente do resultado
                btnContinuar.disabled    = false;
                btnContinuar.textContent = "Continuar";

            }

        });

    </script>
    
    <script src="/js/tema.js"></script>

</body>
</html>
