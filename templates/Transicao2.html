<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bixuco — Relatórios</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="/css/transicao2.css"
    >
    <link rel="stylesheet" href="/css/tema.css">
    <link rel="stylesheet" href="/css/publico.css">

    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">
    <script src="/js/deeplink.js"></script>


</head>

<body class="pagina-publica pagina-transicao">

    <div class="controles-publicos controles-publicos--pagina" aria-label="Preferências da página">
        <button type="button" class="controle-publico controle-publico--icone" id="btnTemaMobile" aria-label="Alternar tema" title="Alternar tema"><i class="fa-regular fa-sun"></i></button>
        <button type="button" class="controle-publico" id="btnTraduzir"><i class="fa-solid fa-language"></i><span id="textoTradutor">EN</span></button>
    </div>

    <main id="conteudo">

        <!-- Pular -->

        <a
            href="/home"
            class="pular"
        >
            <span data-pt="Pular" data-en="Skip">Pular</span>
        </a>

        <!-- Conteúdo -->

        <section>

            <img
                src="/img/relatorios.png"
                alt="Relatórios"
            >

            <h1>

                <span data-pt="Relatórios diários" data-en="Daily reports">Relatórios diários</span>

            </h1>

            <p>

                <span data-pt="Registre como foi o dia e veja padrões de comportamento ao longo do tempo." data-en="Record how the day went and see behavior patterns over time.">Registre como foi o dia e veja padrões de comportamento ao longo do tempo.</span>

            </p>

        </section>

        <!-- Indicadores -->

        <div>

            <span></span>

            <span class="ativo"></span>

            <span></span>

        </div>

        <!-- Botão voltar -->

        <button id="btnVoltar" data-pt-aria="Voltar" data-en-aria="Back" aria-label="Voltar">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <!-- Botão avançar -->

        <button id="btnAvancar" data-pt-aria="Próximo" data-en-aria="Next" aria-label="Próximo">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

    </main>


    <script src="/js/Transicao2.js" ></script>
    <script src="/js/publico-extra.js"></script>
<script src="/js/tema.js"></script>

</body>

</html>
