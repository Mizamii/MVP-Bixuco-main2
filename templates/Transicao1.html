<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Bixuco — Bem-vindo
    </title>

    <!-- Ícones -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="/css/transicao1.css"
    >
    <script src="/js/deeplink.js"></script>


</head>

<body>

    <main id="tela">

        <!-- Botão Pular -->

        <header>

            <a
                href="/home"
                class="botao-pular"
            >
                Pular
            </a>

        </header>


        <!-- Conteúdo -->

        <section class="conteudo">

            <img
                src="/img/logo-bixuco-colorida.png"
                alt="Logo Bixuco"
                class="conteudo__logo"
            >

            <h1 class="conteudo__titulo">

                Bem-vindo ao Bixuco

            </h1>

            <p class="conteudo__texto">

                Sua pelúcia inteligente vai ajudar a entender os sinais do seu filho(a) com TPS.

            </p>

        </section>


        <!-- Seta -->

        <button
            id="proximo"
            class="botao-proximo"
            aria-label="Próxima tela"
        >

            <i class="fa-solid fa-chevron-right"></i>

        </button>


        <!-- Indicadores -->

        <footer>

            <div class="indicadores">

                <span class="ativo"></span>

                <span></span>

                <span></span>

            </div>

        </footer>

    </main>


    
    <script src="/js/Transicao1.js" ></script>
    <script src="/js/tema.js"></script>

</body>

</html>
