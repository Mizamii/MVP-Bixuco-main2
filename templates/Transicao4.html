<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bixuco — Relatório salvo</title>

    <link
        rel="stylesheet"
        href="/css/transicao4.css"
    >
    <link rel="stylesheet" href="/css/tema.css">
    <link rel="stylesheet" href="/css/publico.css">

    <link rel="icon" type="image/png" href="/img/logo-bixuco-colorida.png">
    <script src="/js/deeplink.js"></script>


</head>

<body class="pagina-publica pagina-transicao">

    <div class="controles-publicos controles-publicos--pagina" aria-label="Preferências da página">
        <button type="button" class="controle-publico controle-publico--icone" id="btnTemaMobile" aria-label="Alternar tema" title="Alternar tema"><i class="fa-regular fa-sun"></i></button>
        <button type="button" class="controle-publico" id="btnTraduzir"><i class="fa-solid fa-language"></i><span id="textoTradutor">EN</span></button>
    </div>

<div class="container">

    <!-- Imagem -->

    <img

        src="/img/gatofeliz.png"

        alt="Bixuco feliz"

        class="bixuco"

    >


    <!-- Título -->

    <h1>

        <span data-pt="Relatório salvo!" data-en="Report saved!">Relatório salvo!</span>

    </h1>


    <!-- Texto -->

    <p class="descricao">

        <span data-pt="Ótimo trabalho! Você registrou o dia de" data-en="Great job! You recorded the day for">Ótimo trabalho! Você registrou o dia de</span>

        <strong id="nomeCrianca">sua criança</strong>.

        <br>

        <span data-pt="Continue assim para ver os padrões ao longo do tempo." data-en="Keep it up to see patterns over time.">Continue assim para ver os padrões ao longo do tempo.</span>

    </p>


    <!-- Card de sequência -->

    <div class="card-sequencia">

        <div class="icone">

            🔥

        </div>

        <div class="texto-sequencia">

            <h3>

                <span id="diasSeguidos">

                    1

                </span>

                <span id="textoDias">

                    dia sem nenhuma crise! Parabéns!

                </span>

            </h3>

            <p>

                <span id="textoApoioSequencia" data-pt="Cada dia sem crise conta para a sua ofensiva" data-en="Every crisis-free day counts toward your streak">Cada dia sem crise conta para a sua ofensiva</span>

            </p>

        </div>

    </div>


    <!-- Botão -->

    <button

        id="btnInicio"

        type="button"

    >

        <span data-pt="Voltar ao início" data-en="Back to home">Voltar ao início</span>

    </button>

</div>


<script src="/js/Transicao4.js"></script>

<script src="/js/publico-extra.js"></script>
<script src="/js/tema.js"></script>

</body>

</html>
