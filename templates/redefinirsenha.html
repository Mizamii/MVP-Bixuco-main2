<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bixuco — Redefinir senha</title>

    <!-- Biblioteca de ícones -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Reaproveita o mesmo CSS da tela de criar conta — layout idêntico -->
    <link
        rel="stylesheet"
        href="/css/criarcontasenha.css"
    >

</head>

<body>

    <main class="pagina-login">

        <!-- ========================= -->
        <!-- LADO ESQUERDO -->
        <!-- ========================= -->

        <section class="login-esquerda">

            <div class="login-esquerda__geometria"></div>
            <div class="login-esquerda__overlay"></div>

            <div class="login-esquerda__conteudo">

                <!-- Logo branca -->
                <img
                    src="/img/Logo_Branca.png"
                    alt="Logo Bixuco"
                    class="login-esquerda__logo"
                >

                <!-- Título -->
                <h1 class="login-esquerda__titulo">
                    Vamos recuperar
                    seu acesso
                </h1>

                <!-- Texto -->
                <p class="login-esquerda__slogan">
                    Crie uma nova senha para continuar
                    cuidando do bem-estar da criança.
                </p>

            </div>

            <!-- Ilustração -->
            <div class="login-esquerda__ilustracao-wrapper">

                <img
                    src="/img/familia-bixuco.png"
                    alt="Família utilizando o Bixuco"
                    class="login-esquerda__foto"
                >

            </div>

        </section>

        <!-- ========================= -->
        <!-- LADO DIREITO -->
        <!-- ========================= -->

        <section class="login-direita">

            <header class="criarconta-header">

                <h2 class="criarconta-titulo">
                    Redefinir senha
                </h2>

            </header>

            <div class="criarconta-corpo">

                <!-- ========================= -->
                <!-- FORMULÁRIO -->
                <!-- ========================= -->

                <form id="formRedefinir" class="cadastro-form" novalidate>

                    <!-- Nova senha -->
                    <div class="cadastro-form__grupo">

                        <label for="senha" class="cadastro-form__label">
                            Nova senha
                        </label>

                        <div class="cadastro-form__campo-senha">

                            <input
                                class="cadastro-form__input"
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua nova senha"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="cadastro-form__toggle-senha"
                                onclick="toggleSenha('senha', 'iconeSenha')"
                                aria-label="Mostrar senha"
                            >

                                <i
                                    class="fa-solid fa-eye"
                                    id="iconeSenha"
                                ></i>

                            </button>

                        </div>

                        <span
                            class="cadastro-form__erro"
                            id="erro-senha"
                        ></span>

                    </div>

                    <!-- Confirmar senha -->
                    <div class="cadastro-form__grupo">

                        <label for="confirmarSenha" class="cadastro-form__label">
                            Confirmar senha
                        </label>

                        <div class="cadastro-form__campo-senha">

                            <input
                                class="cadastro-form__input"
                                type="password"
                                id="confirmarSenha"
                                name="confirmarSenha"
                                placeholder="Confirme sua nova senha"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="cadastro-form__toggle-senha"
                                onclick="toggleSenha('confirmarSenha', 'iconeConfirmarSenha')"
                                aria-label="Mostrar confirmação de senha"
                            >

                                <i
                                    class="fa-solid fa-eye"
                                    id="iconeConfirmarSenha"
                                ></i>

                            </button>

                        </div>

                        <span
                            class="cadastro-form__erro"
                            id="erro-confirmarSenha"
                        ></span>

                    </div>

                    <!-- Erro/sucesso geral vindo do servidor -->
                    <span
                        id="erro-geral"
                        class="cadastro-form__erro cadastro-form__erro--geral"
                        style="display: none;"
                    ></span>

                    <button
                        type="submit"
                        id="btnContinuar"
                        class="btn-continuar"
                    >
                        Continuar
                    </button>

                </form>

            </div>

        </section>

    </main>

    <script>

        // ==========================
        // TOKEN DA URL
        // ==========================
        // O link do e-mail chega como /redefinir-senha?token=XXXX.
        // O servidor já validou o token antes de servir esta página —
        // aqui só precisamos reaproveitar o mesmo valor pra mandar
        // junto no POST.

        const parametros = new URLSearchParams(window.location.search);
        const token = parametros.get("token");

        if (!token) {
            // Sem token não tem como redefinir nada — volta pro login
            window.location.href = "/logar";
        }

        // ==========================
        // MOSTRAR / ESCONDER SENHA
        // ==========================

        function toggleSenha(inputId, iconeId) {

            const input = document.getElementById(inputId);
            const icone = document.getElementById(iconeId);

            if (input.type === "password") {
                input.type = "text";
                icone.classList.remove("fa-eye");
                icone.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icone.classList.remove("fa-eye-slash");
                icone.classList.add("fa-eye");
            }

        }

        // ==========================
        // MOSTRAR / LIMPAR ERROS
        // ==========================

        function mostrarErro(inputId, erroId, mensagem) {

            const input = document.getElementById(inputId);
            const erro  = document.getElementById(erroId);

            if (!input || !erro) {
                const erroGeral = document.getElementById("erro-geral");
                if (erroGeral) {
                    erroGeral.textContent   = mensagem;
                    erroGeral.style.display = "block";
                }
                return;
            }

            input.classList.add("input-erro");
            erro.textContent   = mensagem;
            erro.style.display = "block";

            setTimeout(() => {
                input.classList.remove("input-erro");
            }, 500);

        }

        function limparErros() {

            ["senha", "confirmarSenha"].forEach(id => {

                const campo = document.getElementById(id);
                const erro  = document.getElementById("erro-" + id);

                if (campo) campo.classList.remove("input-erro");

                if (erro) {
                    erro.style.display = "none";
                    erro.textContent   = "";
                }

            });

            const erroGeral = document.getElementById("erro-geral");
            if (erroGeral) {
                erroGeral.style.display = "none";
                erroGeral.className = "cadastro-form__erro cadastro-form__erro--geral";
            }

        }

        // ==========================
        // VALIDAÇÃO LOCAL
        // ==========================
        // Mesma regra que o backend realmente aplica em POST /redefinir-senha:
        // mínimo 6 caracteres e as duas senhas iguais.

        function validarCampos() {

            limparErros();
            let valido = true;

            const senha          = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;

            if (senha.length < 6) {
                mostrarErro("senha", "erro-senha", "A senha deve ter pelo menos 6 caracteres.");
                valido = false;
            }

            if (valido && senha !== confirmarSenha) {
                mostrarErro("confirmarSenha", "erro-confirmarSenha", "As senhas não coincidem.");
                valido = false;
            }

            return valido;

        }

        // ==========================
        // ENVIO DO FORMULÁRIO
        // ==========================

        document.getElementById("formRedefinir").addEventListener("submit", async (evento) => {

            evento.preventDefault();

            if (!validarCampos()) return;

            const btnContinuar = document.getElementById("btnContinuar");
            const erroGeral    = document.getElementById("erro-geral");

            btnContinuar.disabled    = true;
            btnContinuar.textContent = "Salvando...";

            try {

                const resposta = await fetch("/redefinir-senha", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token:           token,
                        senha:           document.getElementById("senha").value,
                        confirmarSenha:  document.getElementById("confirmarSenha").value
                    })
                });

                const dados = await resposta.json();

                if (resposta.ok) {

                    // Senha realmente trocada no banco — avisa e manda pro login
                    erroGeral.textContent   = dados.mensagem || "Senha redefinida com sucesso!";
                    erroGeral.className     = "cadastro-form__erro cadastro-form__erro--geral cadastro-form__erro--sucesso";
                    erroGeral.style.display = "block";

                    btnContinuar.textContent = "Redirecionando...";

                    setTimeout(() => {
                        window.location.href = "/logar";
                    }, 1800);

                    return;

                }

                erroGeral.textContent   = dados.erro || "Erro ao redefinir a senha. Tente novamente.";
                erroGeral.style.display = "block";

                btnContinuar.disabled    = false;
                btnContinuar.textContent = "Continuar";

            } catch (erro) {

                console.log("Erro na requisição:", erro);

                erroGeral.textContent   = "Erro de conexão. Verifique sua internet e tente novamente.";
                erroGeral.style.display = "block";

                btnContinuar.disabled    = false;
                btnContinuar.textContent = "Continuar";

            }

        });

    </script>

</body>
</html>
